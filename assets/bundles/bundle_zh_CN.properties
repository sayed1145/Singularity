bullet.blackhole-lensing.name = 引力透镜

# V1炮塔 / Original six turrets
block.blackhole-needlefall.name = 针雨
block.blackhole-needlefall.description = 双管速射炮塔。铜弹成本低，硅弹可轻微追踪移动目标。
block.blackhole-sky-net.name = 天罗
block.blackhole-sky-net.description = 专职防空的双发爆破炮塔。钢化玻璃弹会炸裂成对空破片。
block.blackhole-prism-lance.name = 棱枪
block.blackhole-prism-lance.description = 蓄能后射出贯穿地面目标的长距离光束。需要持续供电。
block.blackhole-crater.name = 陨坑
block.blackhole-crater.description = 重型集束迫击炮。塑钢弹散射弹片，爆炸化合物造成大范围爆炸；无法攻击贴身目标。
block.blackhole-boreline.name = 穿隙
block.blackhole-boreline.description = 接连射出两发贯穿弹。钨弹威力更高，且可穿透更多目标。
block.blackhole-halo.name = 星环
block.blackhole-halo.description = 后期防空导弹阵地，连续发射追踪弹。巨浪合金弹命中后产生电弧。

# 双星球共用材料 / Dual-planet materials
item.blackhole-aegis-alloy.name = 以太合金
item.blackhole-signal-core.name = 信号核心
unit.blackhole-aegis-titan.name = 苍盾泰坦
unit.blackhole-aegis-titan.description = 六足泰坦。在六边形棱镜护罩下，搭载蓄能双轨长矛与两座肩部导弹舱。脚步会碾碎下方的一切。

