# v5 奇点 × 以太泰坦矩阵融合扩展

# 融合生产链说明
item.blackhole-aegis-alloy.description = 双星球装甲复合材料；压铸配方现需要奇点的简并物质。
item.blackhole-signal-core.description = 泰坦战术逻辑与生产所需的编码核心；编码时以霍金尘埃稳定信号。
block.blackhole-aegis-press-s.description = 将钛、塑钢、相位织物和简并物质压铸为以太合金。
block.blackhole-signal-encoder-s.description = 将以太合金、硅、巨浪合金与霍金尘埃编码为信号核心。
block.blackhole-titan-bay-s.description = 可制造苍盾、炽霄两台泰坦；两种计划都需要奇点核心。请保持前方出口畅通。

# v6 欧雷利亚远征
planet.blackhole-aurelia.name = 欧雷利亚
item.blackhole-lumenite.name = 流明矿
item.blackhole-lumenite.description = 从欧雷利亚板块矿场开采的蓝白晶体矿。
item.blackhole-resonance-shard.name = 共振碎片
item.blackhole-resonance-shard.description = 由被守住的裂隙锚稳定后放出的碎片，普通工厂无法合成。
item.blackhole-prism-alloy.name = 棱镜合金
item.blackhole-prism-alloy.description = 由流明矿与共振碎片压制的反光结构合金。
item.blackhole-concord-core.name = 协律核心
item.blackhole-concord-core.description = 三座稳定裂隙锚围绕一座中继谐振时才会产生的稀有协调核心。
block.blackhole-aurelia-core.name = 欧雷利亚核心
block.blackhole-aurelia-core.description = 欧雷利亚战役的远征指挥核心。最多支持 18 个单位。
block.blackhole-rift-anchor.name = 裂隙锚
block.blackhole-rift-anchor.description = 只能放在天然共振床上。供电且周围无敌人时会稳定裂隙，并周期性放出共振碎片；失守只会倒退进度，不会直接摧毁成果。
block.blackhole-harmonic-relay.name = 谐振中继器
block.blackhole-harmonic-relay.description = 不是工厂，而是空间网络装置。把它置于三座被守住、已稳定裂隙锚范围内，即可合成协律核心。
block.blackhole-prism-press.name = 棱镜压机
block.blackhole-prism-press.description = 将流明矿与共振碎片压制成棱镜合金。
block.blackhole-aurelia-fabricator.name = 欧雷利亚制造厂
block.blackhole-prism-pylon.name = 棱镜塔
block.blackhole-prism-pylon.description = 远程穿透电力炮塔。
block.blackhole-arc-mortar.name = 弧光迫击炮
block.blackhole-arc-mortar.description = 向地面目标抛射共振电荷的电力火炮。
unit.blackhole-glint.name = 微光
unit.blackhole-glint.description = 快速欧雷利亚侦察无人机。
unit.blackhole-aurora-guard.name = 极光卫士
unit.blackhole-aurora-guard.description = 带护盾的远征卫士，配备双棱镜长矛与六边形棱镜护罩。
bar.blackhole.rift-stability = 裂隙稳定度
bar.blackhole.rift-threatened = 裂隙遭到威胁
bar.blackhole.harmonic-links = 已稳定裂隙锚：{0}/{1}
# v6.1 欧雷利亚修复：自启动战役与跨星球配给
planet.blackhole-aurelia.description = 拥有独立材料、机器与单位的苍白远征行星。每次登陆都会获得装有流明矿与金辉矿的欧雷利亚核心，附近有流明矿与金辉矿脉、淤砂沙丘、潮汐水池与四处可防守的共振床。
unit.blackhole-lumen-pilot.name = 流明机体
unit.blackhole-lumen-pilot.description = 欧雷利亚可由玩家操控的登陆机体。可开采流明矿、建造建筑，并装备小型棱晶发射器。
block.blackhole-lumen-extractor.name = 流明钻机
block.blackhole-lumen-extractor.description = 欧雷利亚钻头。可开采流明矿、金辉矿与淤砂。
block.blackhole-aurora-panel.name = 极光板
block.blackhole-aurora-panel.description = 初始太阳能发电机，为早期裂隙锚供电。
block.blackhole-prism-resonator.name = 棱镜共振器
block.blackhole-prism-resonator.description = 借助流明等离子，从流明矿与共振碎片中精炼双倍棱镜合金。
block.blackhole-aurelia-fabricator.description = 建造欧雷利亚的地面与空中单位。

# v7
setting.bh-lens.name = 黑洞引力透镜（GPU）

# v7.1: Aurelia uses only its own content
item.blackhole-aurite.name = 金辉矿
item.blackhole-aurite.description = 从欧雷利亚矿脉开采的柔软金色金属。用于建筑、墙体、弹药与舰体。
item.blackhole-silt.name = 淤砂
item.blackhole-silt.description = 从极光沙中提取的细腻紫灰色淤砂。与流明矿一同烧制成棱镜玻璃。
item.blackhole-prism-glass.name = 棱镜玻璃
item.blackhole-prism-glass.description = 由淤砂与流明矿烧制的六边形透明玻璃。用于光学、逻辑与修复设备。
liquid.blackhole-tidewater.name = 潮汐水
liquid.blackhole-tidewater.description = 从欧雷利亚浅滩抽取的富矿物水。驱动潮汐涡轮并供给等离子混合器。
liquid.blackhole-lumen-plasma.name = 流明等离子
liquid.blackhole-lumen-plasma.description = 由潮汐水与流明矿混合的紫色等离子体。棱镜共振器必需。
status.blackhole-brine-soaked.name = 浸卤
status.blackhole-brine-soaked.description = 被矿物水浸透而减速。共振冲击对浸卤目标伤害更高；可扑灭流明灼烧。
status.blackhole-lumen-burn.name = 流明灼烧
status.blackhole-lumen-burn.description = 冰冷的蓝色火焰，缓慢侵蚀装甲。
status.blackhole-resonance-shock.name = 共振冲击
status.blackhole-resonance-shock.description = 谐波冲击：移动与武器都变慢。
block.blackhole-resonance-bed.name = 共振床
block.blackhole-resonance-bed.description = 天然共振节点。裂隙锚只能建在这里。
block.blackhole-aurora-sand.name = 极光沙
block.blackhole-aurora-sand.description = 松散沙地；钻头可从中提取淤砂。
block.blackhole-aurora-water.name = 极光浅滩
block.blackhole-aurora-water.description = 泵可从中抽取潮汐水。涉水单位会被浸卤。
block.blackhole-lumen-vault.name = 流明仓库
block.blackhole-lumen-vault.description = 储存物品。紧贴核心时扩展核心容量。
block.blackhole-lumen-unloader.name = 流明装卸器
block.blackhole-lumen-unloader.description = 从相邻容器中取出所选物品。
block.blackhole-lumen-mender.name = 流明修复器
block.blackhole-lumen-mender.description = 周期性地以流明光脉冲修复附近建筑。
block.blackhole-lumen-conveyor.name = 流明传送带
block.blackhole-lumen-conveyor.description = 沿发光履带向前输送物品。
block.blackhole-lumen-junction.name = 流明交叉器
block.blackhole-lumen-junction.description = 让两条传送线交叉通过。
block.blackhole-lumen-router.name = 流明路由器
block.blackhole-lumen-router.description = 将物品分配到最多三个方向。
block.blackhole-lumen-sorter.name = 流明分类器
block.blackhole-lumen-sorter.description = 所选物品直行，其余物品向左右分流。
block.blackhole-lumen-bridge.name = 流明桥
block.blackhole-lumen-bridge.description = 跨越地形与建筑输送物品。
block.blackhole-tide-pump.name = 潮汐泵
block.blackhole-tide-pump.description = 从欧雷利亚浅滩抽取潮汐水。
block.blackhole-lumen-conduit.name = 流明导管
block.blackhole-lumen-conduit.description = 向前输送液体。
block.blackhole-lumen-liquid-router.name = 流明液体路由器
block.blackhole-lumen-liquid-router.description = 向各个方向分配液体。
block.blackhole-lumen-liquid-bridge.name = 流明液体桥
block.blackhole-lumen-liquid-bridge.description = 跨越地形与建筑输送液体。
block.blackhole-lumen-burner.name = 流明燃烧机
block.blackhole-lumen-burner.description = 燃烧流明矿发电。
block.blackhole-tide-turbine.name = 潮汐涡轮
block.blackhole-tide-turbine.description = 利用流动的潮汐水发电。
block.blackhole-lumen-node.name = 流明节点
block.blackhole-lumen-node.description = 在建筑之间连接电力。
block.blackhole-lumen-cell.name = 流明电池
block.blackhole-lumen-cell.description = 储存多余电力。
block.blackhole-silt-kiln.name = 淤砂窑
block.blackhole-silt-kiln.description = 将淤砂与流明矿烧制成棱镜玻璃。
block.blackhole-plasma-mixer.name = 等离子混合器
block.blackhole-plasma-mixer.description = 将潮汐水与流明矿混合为流明等离子。
block.blackhole-lumenite-wall.name = 流明墙
block.blackhole-lumenite-wall.description = 基础欧雷利亚墙体。
block.blackhole-lumenite-wall-large.name = 大型流明墙
block.blackhole-lumenite-wall-large.description = 基础欧雷利亚墙体，占四格。
block.blackhole-aurite-wall.name = 金辉墙
block.blackhole-aurite-wall.description = 厚重的金色墙体。
block.blackhole-aurite-wall-large.name = 大型金辉墙
block.blackhole-aurite-wall-large.description = 厚重的金色墙体，占四格。
block.blackhole-lumen-spark.name = 流明火花
block.blackhole-lumen-spark.description = 初始电力炮塔：高速流明弹，使目标陷入共振冲击。
block.blackhole-shard-volley.name = 碎片齐射炮
block.blackhole-shard-volley.description = 双管物品炮塔，发射金辉弹或共振碎片弹。潮汐水冷却可提高射速。
block.blackhole-tide-dock.name = 潮汐船坞
block.blackhole-tide-dock.description = 漂浮船坞。建造欧雷利亚海军单位：潮汐快艇与潮汐守望者。
block.blackhole-lumen-processor.name = 流明处理器
block.blackhole-lumen-processor.description = 运行逻辑代码（与微型处理器指令集相同）。
block.blackhole-lumen-memory.name = 流明内存
