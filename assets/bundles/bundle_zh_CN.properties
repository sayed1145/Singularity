# ---- merged v7.5: Voxel Industry + Voxel Outpost
item.blackhole-voxel-alloy.name = 体素合金
item.blackhole-voxel-alloy.description = 以硅为核心生长出的钛泡沫晶格。轻、硬、略带导电性，是体素工业所有机体的结构材料。
block.blackhole-voxel-forge.name = 体素熔炉
block.blackhole-voxel-forge.description = 三座力场塔把硅钛熔体悬浮在基座上方，八个体素单元逐渐汇聚成核心，在嵌套的陀螺环中旋转；成品合金锭沿滑槽滑出。需要冷冻液维持力场塔低温。
block.blackhole-voxel-assembler.name = 体素装配厂
block.blackhole-voxel-assembler.description = 龙门式打印工厂：横梁与打印头在打印床上来回扫动，激光把真正的三维单位一层一层打印出来。可生产镶嵌者、蛛行者与巨像。
unit.blackhole-tessellus.name = 镶嵌者
unit.blackhole-tessellus.description = 四涵道支援无人机：涵道随飞行方向倾转，旋翼随推力加速，机腹双联激光炮塔自动索敌。可采矿、重建与作战。
unit.blackhole-arachne.name = 蛛行者
unit.blackhole-arachne.description = 四足突击步行机：长腿可跨越墙体，炮塔可 360 度旋转——重型主炮、双联转管机枪与导弹巢。
unit.blackhole-titan.name = 巨像
unit.blackhole-titan.description = 上下半身完全分离的双足突击机甲：躯干、肩炮与头部 360 度转向瞄准方向，双腿可向任意方向行走、横移或倒退。肩部等离子炮、臂载机炮与背包导弹；推进背包可跃过地形并在落地时震击。
item.blackhole-magnetic-slug.name = 磁性弹芯
item.blackhole-magnetic-slug.description = 由压铸机电磁塑形的高强度弹芯。可由普通传送带输送至前哨磁轨炮。
item.blackhole-flux-coil.name = 聚能线圈
item.blackhole-flux-coil.description = 绕线机精密绕制的铜硅加速线圈。 aegis 轻型兰斯炮的弹药。
block.blackhole-slug-press.name = 弹芯压铸机
block.blackhole-slug-press.description = 对向液压活塞压制石墨、钛和硅，输出磁性弹芯。需要电力；可用传送带直接供给炮塔。
block.blackhole-coil-winder.name = 线圈绕线机
block.blackhole-coil-winder.description = 精密主轴把铜和硅绕成聚能线圈。需要电力；供给 aegis 兰斯炮。
block.blackhole-bastion-railgun.name = 前哨磁轨炮
block.blackhole-bastion-railgun.description = 4x4 重型攻城磁轨炮：四角堡垒由装甲裙墙连成一体，尾部电容堆供能，旋转炮塔带后坐双轨。消耗磁性弹芯与电力，可攻击空中及地面目标。
block.blackhole-aegis-lancer.name = aegis 兰斯炮
block.blackhole-aegis-lancer.description = 3x3 速射线圈炮，紧凑旋转炮塔，连发自导聚能弹。消耗聚能线圈与电力，可攻击空中及地面目标。

# ---- v7.5 欧雷莉亚工业包：新矿机 / 发电厂 / 单位修复站
block.blackhole-aurite-auger.name = 金辉螺旋钻机
block.blackhole-aurite-auger.description = 三格重型螺旋钻。四根支柱把八角机壳架在矿脉上方，中央螺旋柱边转边把矿石提到顶环，再从南侧溜槽送出。需要电力，可开采硬度 4 以内的矿物。
block.blackhole-resonance-sifter.name = 共振筛选机
block.blackhole-resonance-sifter.description = 两格振动筛。倾斜筛网以每秒数次的频率抖动，把矿屑从碎石中分出；接入潮汐水后冲洗效率大幅提升。
block.blackhole-prism-harvester.name = 棱镜采掘场
block.blackhole-prism-harvester.description = 四格重型采掘场。齿冠环带动下方的五刃切割头旋转，可开采硬度 5 以内的矿物。耗电较高，通入流明等离子体可进一步加速。
block.blackhole-rift-collector.name = 裂隙汇聚器
block.blackhole-rift-collector.description = 全新机制：它不挖脚下的地面。安放时只需要空位（水面也可以），建成后朝着面向的方向张开一个 34 度的采集锥，把锥内 16 格范围里的矿石直接抽上来——隔着墙、建筑和水面都可以，同时最多牵引三束。可选矿物就是锥内真实存在的矿：地面矿与岩壁矿都会列出，转向或矿脉采尽后列表立即更新。旋转建筑即可换方向。
block.blackhole-plasma-dynamo.name = 等离子涡轮机
block.blackhole-plasma-dynamo.description = 三格卧式涡轮发电机。共振碎片在等离子回路中点燃，推动转鼓末端的叶轮，稳定输出 7.2 电力/秒。
block.blackhole-aurora-array.name = 极光阵列
block.blackhole-aurora-array.description = 三格大型光伏阵列。三翼集光板沿脊梁缓慢跟踪天光，无需燃料，输出 2.1 电力/秒。
block.blackhole-lumen-repair-beam.name = 流明修复光束
block.blackhole-lumen-repair-beam.description = 修复“单位”的设施（建筑请用流明维修器）。云台头会转向范围内受损最重的友军单位，以 110 生命/秒持续修补。
block.blackhole-aurora-repair-dome.name = 极光修复穹顶
block.blackhole-aurora-repair-dome.description = 大型单位维修站。发射冠环同时牵引最多四个受损友军单位，每个 240 生命/秒，覆盖 22 格半径。


# ---- v7.6 欧雷莉亚前沿包：新流体 / 缆道运输 / 新机制防御 / 新单位
liquid.blackhole-aurora-coolant.name = 极光冷凝液
liquid.blackhole-aurora-coolant.description = 由潮汐水低温冷凝而成的淡青色工作液。可作炮塔冷却剂，也能给需要散热的设备加速。
liquid.blackhole-graviton-slurry.name = 引力浆
liquid.blackhole-graviton-slurry.description = 粘稠的重质流体，内部悬浮着被压缩的引力子。引力阱以它加深井深，是重力级设备的燃料。
status.blackhole-lattice-grip.name = 晶格压制
status.blackhole-lattice-grip.description = 被收容晶格按在地面：移动与射速大幅下降。
status.blackhole-stasis-lock.name = 静滞禁锢
status.blackhole-stasis-lock.description = 被封在晶格牢笼里：无法移动、无法开火。解除后短时间内不会再次被禁锢。
block.blackhole-coolant-condenser.name = 冷凝塔
block.blackhole-coolant-condenser.description = 三格冷凝塔。潮汐水在柱内被压缩降温，顶部压缩机扇叶持续抽走热量，产出极光冷凝液。
block.blackhole-graviton-churn.name = 引力离心机
block.blackhole-graviton-churn.description = 四格重型离心机。横置的滚筒把流明等离子与金辉矿一起甩成引力浆，是重力级科技的起点。
block.blackhole-flux-conveyor.name = 通量传送带
block.blackhole-flux-conveyor.description = 流明传送带的高速型号，13.2 件/秒，约为原型的两倍。造价里加入棱镜合金，用于主干线。
block.blackhole-flux-conduit.name = 通量导管
block.blackhole-flux-conduit.description = 高压导管：容量与压力都高于流明导管，适合长距离输送冷凝液与引力浆。
block.blackhole-skyline-cableway.name = 星索缆道
block.blackhole-skyline-cableway.description = 全新运输机制：两座塔之间架一条索道，货舱沿缆绳在空中滑行，直接越过墙壁、水面、建筑甚至敌军阵线。放置后点击另一座塔即可连接，最远 26 格；不像桥梁要一跳一跳接力，也不像质量驱动器要攒满才发车，货舱装满即走，形成连续不断的高吞吐干线。
block.blackhole-gravity-well.name = 引力阱
block.blackhole-gravity-well.description = 全新防御机制：它不开火。三根内倾支柱在中央撑起一口引力漏斗，把范围内的敌方地面单位持续拖向中心并压制，进入中央压碎半径的目标会被不断碾碎。对空无效，友军不受影响；通入引力浆可加深井深。
block.blackhole-aegis-lattice.name = 晶格回馈阵
block.blackhole-aegis-lattice.description = 把射向自己的攻击存起来：范围内的敌方弹药被吞噬并换算成储量，储量充满时以环形冲击波一次打回。与吸收墙同样设有上限——累计吸收 3000 伤害后力场过载、停机 7 秒，吸收量每秒自然消退 24 点，每次放出冲击波后力场锁定 5 秒。对不开火的敌人无效。
block.blackhole-tempest-coil.name = 风暴线圈
block.blackhole-tempest-coil.description = 没有炮管的塔。三组绝缘柱托起悬浮发射环，射出的电弧命中后会继续跳向下一个目标，最多连跳四次，每跳伤害提高 22%。可用极光冷凝液冷却。
block.blackhole-resonance-cradle.name = 共振摇篮
block.blackhole-resonance-cradle.description = 两格轻型单位台，造价与耗电都极低，矿机研究完即可建造。生产微尘无人机与晶格蠕者，让开局不必等到欧雷利亚制造厂。
block.blackhole-lattice-link.name = 晶格链路
block.blackhole-lattice-link.description = 全新逻辑机制：同一阵营的所有晶格链路共享同一段 64 格内存。在地图这一端写入第 7 格，地图另一端立刻读得到——不需要任何连线或中继处理器。
unit.blackhole-mote.name = 微尘
unit.blackhole-mote.description = 巴掌大的廉价无人机。升力环托着一枚小舱体，能采矿、能协助建造，也能用鼻锥的流明针自卫。便宜到可以成群消耗。
unit.blackhole-lattice-crawler.name = 晶格蠕者
unit.blackhole-lattice-crawler.description = 低矮履带炮车。新的攻击方式：抛出的共振装药落地后不立即爆炸，而是塌缩成一圈碎片向四周射出，用于封锁通路而不是正面对轰。
unit.blackhole-tide-lancer.name = 潮汐枪骑
unit.blackhole-tide-lancer.description = 远洋雷击舰。前部双管发射水下鱼雷：航速慢、只打水面与地面目标，但单发威力远超同级火炮；尾部另有一门轻型速射炮自卫。

# ---------------------------------------------------------------- v7.7 堡垒包
item.blackhole-graphite-brick.name = 石墨砖
item.blackhole-graphite-brick.description = 以流明石为粘结剂烧结淤砂而成。全星球最便宜的致密材料：整条城墙线、引力弦发电机的慢化剂，以及燃料组件生产线现在都改用它。
block.blackhole-ore-resonance.name = 共振矿脉
block.blackhole-ore-resonance.description = 直接长在地面的共振碎晶。稀少且坚硬，是唯一需要四级钻头才能开采的地表矿。
block.blackhole-sinter-wall.name = 烧结砖墙
block.blackhole-sinter-wall.description = 最廉价的墙。烧结砖加流明石，自带绝缘：电弧与热量止步于此，不会顺着墙线传导。
block.blackhole-graphite-brick-wall.name = 石墨砖墙
block.blackhole-graphite-brick-wall.description = 四格实心砌体。石墨直接吸收光束武器，同时具备绝缘性。
block.blackhole-prism-mirror-wall.name = 棱镜反射墙
block.blackhole-prism-mirror-wall.description = 砖砌基座上的多面镜。相当比例的来袭弹体会被原路反弹回射击者。
block.blackhole-stasis-wall.name = 静滞墙
block.blackhole-stasis-wall.description = 贴上来的敌人会失去立足：接触到墙体的地面单位被收容晶格束缚，只能缓慢爬行。一排静滞墙能把冲锋变成散步。
block.blackhole-echo-wall.name = 回响墙
block.blackhole-echo-wall.description = 它承受的每一点伤害都会被储存。储能满了——或者墙终于被打碎时——积蓄会以一圈闪电释放出去。挨打就是在给它充能。
block.blackhole-frost-wall.name = 霜冷墙
block.blackhole-frost-wall.description = 接入极光冷却液后，它会一边挨打一边自我修复。断了冷却液，它就只是一堵厚重的金辉墙。
block.blackhole-anchor-wall.name = 引力锚墙
block.blackhole-anchor-wall.description = 刻意造得极重的方块，把地面敌人拽向自己。它本身不造成伤害，只为后面的防线争取时间。
block.blackhole-amplifier-wall.name = 晶格增幅墙
block.blackhole-amplifier-wall.description = 支援型砌体：只要它还立着，范围内所有友方炮塔的装填都会加快。应当放在火力线后方，而不是前面。
block.blackhole-absorber-wall.name = 裂隙吸收墙
block.blackhole-absorber-wall.description = 进入其场域的敌方弹体会被整个吞下，能量不进入墙体，而是直接并入你的电网。
block.blackhole-concord-shield-wall.name = 协律力场墙
block.blackhole-concord-shield-wall.description = 通电后在自身前方撑起护盾。护盾承伤并自行恢复，只有在护盾过载后墙体才开始掉血。
block.blackhole-graviton-string-dynamo.name = 引力弦发电机
block.blackhole-graviton-string-dynamo.description = 一团质量被引力弦悬在两道反向旋转的万向环之间。引力泥浆维持弦的张紧，石墨砖充当慢化剂；5×5 一台即可输出每秒数千电力，约等于八台等离子发电机。
block.blackhole-aurelia-bastion.name = 欧雷利亚堡垒核心
block.blackhole-aurelia-bastion.description = 二级核心。直接建造在欧雷利亚核心之上：两倍储量、两倍单位上限、远更高的装甲，并以堡垒领航者取代流明领航者。
unit.blackhole-bastion-pilot.name = 堡垒领航者
unit.blackhole-bastion-pilot.description = 堡垒核心的核心单位。三种领航者中采矿最快，建造范围与速度接近流明领航者的两倍，并且带有一门像样的机炮。无法开采共振碎晶。
unit.blackhole-bastion-warden.name = 堡垒守卫
unit.blackhole-bastion-warden.description = 二级核心解锁、由制造厂生产的护卫机。速度慢、装甲厚，一门溅射炮塔，外加一只永不停转的扫描天线。

# v7.8
block.blackhole-aurora-node.name = 大型电力节点
block.blackhole-aurora-node.description = 连接数量和距离都远超小型节点的输电节点。
block.blackhole-resonance-hub.name = 共振枢纽
block.blackhole-resonance-hub.description = 附近的友军作战时为它充能；充满后六秒内强化范围内所有友军单位，并修复周围建筑，随后进入冷却。
status.blackhole-resonance-overload.name = 共振过载
status.blackhole-resonance-overload.description = 短时间内伤害、移动与装填速度提升。
bar.resonance = 共振：{0} / {1}
unit.blackhole-aurora-heavy.name = 极光重机
unit.blackhole-aurora-heavy.description = 重型武装飞机。顶部一座旋转炮塔，两侧各一门固定机炮，装甲厚实。
unit.blackhole-prism-scout.name = 棱镜侦察车
unit.blackhole-prism-scout.description = 轻型履带侦察车。速度快、造价低，只打地面。
unit.blackhole-aurite-lancer.name = 金辉突击车
unit.blackhole-aurite-lancer.description = 中型坦克，一门长管炮，可穿透两个目标。
unit.blackhole-resonance-siege.name = 共振炮车
unit.blackhole-resonance-siege.description = 低速火炮坦克。射程远、溅射高，无对空能力。
unit.blackhole-lumen-courier.name = 流明信使
unit.blackhole-lumen-courier.description = 后勤飞机。可采矿、可建造，载量六十，不参与战斗。
unit.blackhole-aurora-sentry.name = 极光哨卫机
unit.blackhole-aurora-sentry.description = 轻型截击机，两门固定机炮，对空对地皆可。

# ---- v7.9：新地形与随之而来的单位
block.blackhole-glass-flat.name = 盐晶滩
block.blackhole-glass-flat.description = 坚硬明亮的地面，单位在上面跑得比任何地形都快。
block.blackhole-ember-ash.name = 余烬灰原
block.blackhole-ember-ash.description = 温热的火山灰，算作热地，并含有少量石油。
block.blackhole-frost-crust.name = 霜壳冻土
block.blackhole-frost-crust.description = 冻结的地壳。通行较慢，但足够潮湿，可供抽水。
block.blackhole-aurite-gravel.name = 金辉砾石
block.blackhole-aurite-gravel.description = 含金属的碎石地。地面本身就能挖出金辉矿。
block.blackhole-resonance-silt.name = 共振细砂
block.blackhole-resonance-silt.description = 泛紫光的细砂，产出淤泥，并略带热量。
block.blackhole-plasma-vent.name = 等离子喷口
block.blackhole-plasma-vent.description = 欧雷利亚最热的地面，适合一切需要热量的设备。
block.blackhole-basalt-shelf.name = 玄武台地
block.blackhole-basalt-shelf.description = 朴素的基岩地面，没什么特别，地下石油充足。
block.blackhole-wall-ore-lumenite.name = 流明矿脉
block.blackhole-wall-ore-lumenite.description = 嵌在实心岩壁里的流明矿，裂隙汇集器或掘岩车可以直接把它从墙里挖出来。
block.blackhole-wall-ore-aurite.name = 金辉矿脉
block.blackhole-wall-ore-aurite.description = 嵌在实心岩壁里的金辉矿，裂隙汇集器或掘岩车可以直接把它从墙里挖出来。
block.blackhole-wall-ore-resonance.name = 共振矿脉
block.blackhole-wall-ore-resonance.description = 嵌在实心岩壁里的共振碎晶，需要四级及以上的采掘设备。
unit.blackhole-terra-borer.name = 掘岩工程车
unit.blackhole-terra-borer.description = 采矿工程车。既能挖地面矿，也能把矿从岩壁里掘出来，可建造，载量一百二十。
unit.blackhole-basalt-guard.name = 玄武卫士
unit.blackhole-basalt-guard.description = 重型护卫坦克。双管短炮、重装甲，无对空能力。
unit.blackhole-glass-harrier.name = 盐晶掠击机
unit.blackhole-glass-harrier.description = 高速截击机。两门固定机炮，对空对地皆可。
unit.blackhole-vent-caller.name = 喷口支援机
unit.blackhole-vent-caller.description = 远程支援炮艇。腹部炮塔可越墙抛射，打击地面目标。

# ---- v8.0-beta：运输与支援层 ----
block.blackhole-wall-bore.name = 凿墙机
block.blackhole-wall-bore.description = 向正前方的岩壁射出直线激光，直接切下墙体中的矿脉。射程六格，双通道。注入等离子可加速。
block.blackhole-lumen-cargo-station.name = 流明货运站
block.blackhole-lumen-cargo-station.description = 物流网中枢：自行建造并保有 3 架搬运无人机，并接管附近无归属的重型运输机。它调度 58 格内的全部节点——请求优先由仓库供货，其次中枢自身，最后才动用供货台，并由距离最近的空闲无人机执行。
block.blackhole-lumen-cargo-point.name = 流明货运台
block.blackhole-lumen-cargo-point.description = 需求节点：设定一种物品后由物流网持续补货，并自动转交给相邻方块。传送带无法塞入，只有无人机能装填。
block.blackhole-lumen-mend-dome.name = 大型流明修复器
block.blackhole-lumen-mend-dome.description = 大型修复投射器。范围远大于小型修复器，单次修复量也高得多。投入棱镜玻璃可强化。
block.blackhole-lumen-accumulator.name = 大型流明电池
block.blackhole-lumen-accumulator.description = 大容量储能组。单个占地内约等于十个流明电池，爆炸威力同样成正比。
block.blackhole-ground-well.name = 陆地抽水机
block.blackhole-ground-well.description = 从潮湿地面抽取潮汐水。产量取决于脚下土壤的含水量，工厂不必再紧贴湖泊建造。
unit.blackhole-lumen-drone.name = 货运无人机
unit.blackhole-lumen-drone.description = 物流网的搬运机：执行中枢下发的运输任务，由中枢建造并归其所有。
unit.blackhole-lumen-medic.name = 修复无人机
unit.blackhole-lumen-medic.description = 支援型飞行器。以修复光束治疗建筑，也能帮忙补完建造。不携带武器。
unit.blackhole-aurite-wright.name = 工程车
unit.blackhole-aurite-wright.description = 履带式工程单位。建造迅速、载货量大，可挖掘地面矿物并修补受损建筑。

# ---- v8.1 物流网 / 液体层 / 新单位
block.blackhole-lumen-supply-post.name = 供货台
block.blackhole-lumen-supply-post.description = 被动供货节点：传送带向它供料，只有当网络中确实有人提出需求时才会被取走，不会把没人要的货推出去。
block.blackhole-lumen-buffer-post.name = 缓存台
block.blackhole-lumen-buffer-post.description = 需求与供货合一：设定物品后在本地囤一份库存，并就近供应周围的需求节点——把一次长途运输拆成多次短途。
block.blackhole-lumen-logistics-vault.name = 物流仓库
block.blackhole-lumen-logistics-vault.description = 网络仓储：中枢的余量会被存到这里；满足请求时优先从仓库取货，其次才动用供货台，库存因此持续流动而不是堆死。
block.blackhole-lumen-liquid-relay.name = 液体中继塔
block.blackhole-lumen-liquid-relay.description = 无线液体运输：每座中继塔自动与 22 格内的其它中继塔互联，整组液位自动拉平，可越过导管无法铺设的地形。它只做"拉平"不做"加压"，每刻最多 9 单位。
block.blackhole-lumen-tank.name = 液体储罐
block.blackhole-lumen-tank.description = 小型液体储存，容量 1500，用于缓冲泵线或中继网络。
block.blackhole-lumen-reservoir.name = 大型蓄液池
block.blackhole-lumen-reservoir.description = 大型液体储存，容量 6500，供泵量跟不上峰值时的工厂取用。
block.blackhole-lumen-overflow-gate.name = 溢流门
block.blackhole-lumen-overflow-gate.description = 物品优先直行；前方方块收不下时，才分流到两侧。
block.blackhole-lumen-underflow-gate.name = 反向溢流门
block.blackhole-lumen-underflow-gate.description = 反向逻辑：优先送往负载最低的一侧，两侧都满时才直行。
unit.blackhole-lumen-hauler.name = 流明运输机
unit.blackhole-lumen-hauler.description = 重型货运飞行器，载量 220。在工厂建造后会自行飞往最近的中枢并加入该物流网——这是扩充网络运力的方式。
unit.blackhole-aurite-vanguard.name = 金辉先锋
unit.blackhole-aurite-vanguard.description = 地面破阵车：重装甲、带溅射的穿透主炮，另有一门同轴机炮应付轻型空中目标。速度慢，适合带队推进而非追击。
unit.blackhole-tide-tender.name = 潮汐补给艇
unit.blackhole-tide-tender.description = 带高压水炮的海上液体运输艇，在中继塔供电成链之前为海岛前哨送水。

# ---- v8.1：地形方块也给出用途说明，数据库中不再有空白条目
block.blackhole-aurora-plate.name = 极光硬盘岩
block.blackhole-aurora-plate.description = 欧雷莉亚最常见的晶质硬地。平整干燥、可建造，钻头可以穿过它开采下方矿脉。
block.blackhole-prism-shale.name = 棱镜页岩
block.blackhole-prism-shale.description = 山脊地带的脆性层状岩地面。可建造，也是周围页岩墙体的来源。
block.blackhole-lumen-moss.name = 流明苔原
block.blackhole-lumen-moss.description = 洼地中的潮湿发光地面。可建造，并提示地表下有水源。
block.blackhole-aurora-sand-water.name = 极光浅滩
block.blackhole-aurora-sand-water.description = 淤泥上的浅水。地面单位可以涉水通过，舰船无法浮起，抽水设备可在岸边取水。
block.blackhole-deep-aurora-water.name = 极光深水
block.blackhole-deep-aurora-water.description = 开阔深水。只有舰船与飞行器能通过，也是潮汐船坞与大型水泵的所在。
block.blackhole-aurora-wall.name = 极光岩体
block.blackhole-aurora-wall.description = 坚硬的晶质岩体。阻挡移动与火力，为基地挡住一条进攻路线，内部可能含有可供凿墙机开采的矿脉。
block.blackhole-resonance-wall.name = 共振岩体
block.blackhole-resonance-wall.description = 夹杂共振晶体的岩层。不可通行，也是墙体矿脉含量最高的岩石。
block.blackhole-prism-shale-wall.name = 页岩山脊
block.blackhole-prism-shale-wall.description = 层状山脊岩。不可通行的掩体，其中的矿脉同样可由凿墙机开采。
block.blackhole-aurora-dune-wall.name = 沙丘脊
block.blackhole-aurora-dune-wall.description = 海滩边压实的淤泥脊。不可通行的掩体，比岩体更软。
block.blackhole-glass-ridge-wall.name = 玻璃脊岩
block.blackhole-glass-ridge-wall.description = 寒冷平原上的玻璃质岩石。不可通行，常含流明矿脉。
block.blackhole-ember-wall.name = 余烬岩
block.blackhole-ember-wall.description = 高温带的灼烧岩层。不可通行的掩体，内部常见金辉矿脉。
block.blackhole-basalt-wall.name = 玄武台岩
block.blackhole-basalt-wall.description = 高地上的致密暗色岩。不可通行，也是视野阻挡最强的欧雷莉亚墙体。
block.blackhole-aurora-boulder.name = 极光巨石
block.blackhole-aurora-boulder.description = 散落的晶质巨石。仅为装饰，在其上建造时会被自动清除。
block.blackhole-resonance-crystal.name = 共振晶簇
block.blackhole-resonance-crystal.description = 直立生长的晶簇。仅为装饰，但通常意味着附近有共振矿。
block.blackhole-ore-lumenite.name = 流明矿
block.blackhole-ore-lumenite.description = 地表流明矿。所有钻头的起点，也是整条经济链的基础。
block.blackhole-ore-aurite.name = 金辉矿
block.blackhole-ore-aurite.description = 地表金辉矿。结构性金属：墙体、装甲板与几乎所有中期机器都要用它。

# ---- v8.2 指挥包 ----
bh.vent.stat = {0} 发后排热 {1} 秒
aurelia.loadout.desc = 欧雷利亚着陆核心。跨扇区发射所需资源全部改用欧雷利亚资源结算。
block.blackhole-lumen-accelerator.name = 流明加速器
block.blackhole-lumen-accelerator.description = 小型范围超速投影仪。将小半径内的建筑速度提升一半。造价低、有上限，可以安心铺满厂区。
block.blackhole-prism-overcharger.name = 棱镜超充仪
block.blackhole-prism-overcharger.description = 重型范围超速投影仪。范围更大、上限更高；投入共振晶片可进一步扩大范围。耗电较高，加速倍率为硬上限。
unit.blackhole-prism-monolith.name = 棱镜巨碑
unit.blackhole-prism-monolith.description = 泰坦级攻坚平台。三组升力舱托起的整块装甲板，配一门带排热的棱镜长矛与两座轻型防空舱。长矛连射四发后需排热六秒——它能撕开防线，但守不住防线。
status.blackhole-astro-warp-license.description = 标记一个被允许跃迁的单位。由拘留者的控制方块授予，本身没有任何数值效果。

