mod.blackhole.name = 奇点 · Singularity

item.blackhole-degenerate-matter.name = 简并物质
item.blackhole-degenerate-matter.description = 被压缩到电子简并压才能支撑的超致密物质。密度高到一勺就有一座山那么重。

item.blackhole-hawking-dust.name = 霍金尘埃
item.blackhole-hawking-dust.description = 事件视界边缘蒸发出的高能虚粒子被冷凝捕获后的产物，携带巨额电荷。

item.blackhole-singularity-core.name = 奇点核心
item.blackhole-singularity-core.description = 被磁约束封装的微型黑洞。它每一秒都在试图吞掉握着它的那只手。

block.blackhole-graviton-press.name = 引力压机
block.blackhole-graviton-press.description = 用叠加引力场把钛和石墨压成简并物质。压机运转时周围会出现可见的时空涟漪。

block.blackhole-hawking-condenser.name = 霍金冷凝器
block.blackhole-hawking-condenser.description = 在低温腔中捕获霍金辐射，将简并物质与钍转化为霍金尘埃。需要低温液冷却。

block.blackhole-singularity-forge.name = 约束棱镜锻炉
block.blackhole-singularity-forge.description = 核心制造建筑。棱镜约束阵列把一颗真实的奇点钉在锻炉中心：v6.1 版的完整引力透镜会扭曲周围画面，吸积盘、喷流与光子环随生产周期运转。3D 棱镜外壳带阴影与环境光遮蔽烘焙而成，只有奇点本身实时绘制，并受全局帧预算限制。
block.blackhole-accretion-foundry.name = 吸积铸造厂
block.blackhole-accretion-foundry.description = 4x4 铸造流水线：坩埚把熔融的钛-石墨浇入分度模具，液压冲头将冷却后的坯料压成简并物质板，三轴机械臂再把成品取出放到输出滚道上。所有运动部件都是随生产周期驱动的真实 3D 零件。

block.blackhole-accretion-cannon.name = 吸积炮
block.blackhole-accretion-cannon.description = 双管交替速射炮。双管会随后坐前后滑动，蓄能环在预热时张开。装填简并物质发射追踪弹幕，装填霍金尘埃则改射微型黑洞。

block.blackhole-frame-dragger.name = 参考系拖曳炮
block.blackhole-frame-dragger.description = 廉价的入门级速射炮。旋转环持续转动，弹丸带击退与减速效果，可穿透三个目标。

block.blackhole-hawking-emitter.name = 霍金发射器
block.blackhole-hawking-emitter.description = 把视界蒸发辐射准直成穿透光束。蓄力时前端聚焦叶片会向外张开，命中目标附带带电效果。

block.blackhole-quasar-lance.name = 类星体喷流
block.blackhole-quasar-lance.description = 持续灼烧激光炮塔。预热时约束环反向高速旋转、喷口三段展开，光束持续照射时伤害不断累积。

block.blackhole-event-horizon.name = 事件视界炮
block.blackhole-event-horizon.description = 终极兵器。三层约束环反向旋转，炮口悬浮着一颗真黑洞。炮弹落点会种下一颗持续扩大的真实黑洞，全程拖拽并撕碎敌人、吞噬弹幕，并真实扭曲那一整片屏幕画面。

block.blackhole-horizon-assembler.name = 视界装配厂
block.blackhole-horizon-assembler.description = 建造透镜号与能层号等空中单位。六边约束场在装配时会发光。

block.blackhole-citadel-yard.name = 奇点船坞
block.blackhole-citadel-yard.description = 重型龙门船坞，专门建造地面载具与移动作战平台。体积庞大、耗能极高，但能产出整张地图上最强的地面单位。

unit.blackhole-lensing.name = 透镜号
unit.blackhole-lensing.description = 轻型空中侦察机，速度快，自带小型六边引力护盾。

unit.blackhole-ergosphere.name = 能层号
unit.blackhole-ergosphere.description = 重型空中炮艇，背负微型黑洞反应堆，双联发射微型黑洞弹，自带大型护盾与自愈能力。

unit.blackhole-accretor.name = 吸积车
unit.blackhole-accretor.description = 履带式地面支援车。前推装甲铲，携带维修力场持续修复周围友军，并以简并榴弹提供火力支援。

unit.blackhole-citadel.name = 堡垒号
unit.blackhole-citadel.description = 泰坦级移动作战平台 —— 一座会前进的前线基地。巨型履带底盘会随移动滚动，六边约束护盾罩住身边所有友军；约束阵列、脉冲核心、后部装甲和全部炮塔均有独立动画。机库已移除，不会生产任何飞行单位。中央主炮能种下黑洞，四门副炮分别负责对空与对地。

