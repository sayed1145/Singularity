block.blackhole-lumen-display.name = 流明显示屏
block.blackhole-lumen-display.description = 显示逻辑处理器绘制的图形。
unit.blackhole-shard-rover.name = 碎片漫游者
unit.blackhole-shard-rover.description = 轻型履带坦克，搭载单管共振炮。
unit.blackhole-aurite-bulwark.name = 金辉壁垒
unit.blackhole-aurite-bulwark.description = 重型主战坦克。双管炮塔，厚重金色装甲。
unit.blackhole-tide-skiff.name = 潮汐快艇
unit.blackhole-tide-skiff.description = 高速海军巡逻艇。
unit.blackhole-tide-warden.name = 潮汐守望者
unit.blackhole-tide-warden.description = 海军护卫舰，前后各一座双联炮塔。
status.blackhole-titan-overclock.name = 泰坦超频
status.blackhole-titan-overclock.description = 指挥链路超频泰坦武器：伤害 +22%，射速 +18%，速度 +8%。


