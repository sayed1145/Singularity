item.blackhole-uranium-pellets.name = 浓缩燃料芯块
item.blackhole-uranium-pellets.description = 经游戏化核燃料加工得到的陶瓷燃料芯块。原料配方为 Mindustry 平衡设计，不代表现实核燃料制造流程。
item.blackhole-zirconium-cladding.name = 锆合金包壳
item.blackhole-zirconium-cladding.description = 低吸收截面的耐热燃料包壳，用于密封燃料芯块。
item.blackhole-uranium-assembly.name = 铀燃料组件
item.blackhole-uranium-assembly.description = 由燃料芯块、包壳和石墨结构件装配而成的反应堆燃料组件。
liquid.blackhole-demineralized-water.name = 除盐轻水
liquid.blackhole-demineralized-water.description = 经离子交换与精处理的主循环给水；用于通道冷却、沸腾和蒸汽产生。
block.blackhole-pellet-plant.name = 核燃料芯块厂
block.blackhole-pellet-plant.description = 将原版钍与硅加工成模组燃料芯块。这是为了保证原版地图可完整生产而设计的游戏配方。
block.blackhole-cladding-mill.name = 包壳轧制厂
block.blackhole-cladding-mill.description = 以钛和钢化玻璃制造锆合金风格燃料包壳。
block.blackhole-fuel-assembly-plant.name = 燃料组件厂
block.blackhole-fuel-assembly-plant.description = 将燃料芯块、包壳和石墨装配为 RBMK 白色电站可直接消耗的铀燃料组件。
block.blackhole-water-treatment.name = 除盐水处理站
block.blackhole-water-treatment.description = 消耗原版水和电力，连续输出反应堆所需的除盐轻水。
block.blackhole-graphite-kiln.name = 石墨煅烧回转窑
block.blackhole-graphite-kiln.description = 回转窑。自 v7.7 起改为以流明石为助熔剂煅烧淤砂，产出石墨砖——整条堡垒城墙线、引力弦发电机与燃料组件厂都以它为基础。不需要水；烟囱只排出水蒸气。
block.blackhole-rbmk-plant.name = RBMK 白色电站 Mk.II
block.blackhole-rbmk-plant.description = 具有完整燃料/水供应链、引导模式和专业模式的高输出白色软件 3D 电站。额定输出为旧版五倍；专业模式在稳定工况下最高可达旧版十倍。详细信息会明确列出铀燃料组件和除盐轻水输入。
