# ---- v8.3 Astro restoration ----
block.blackhole-astro-commander.name = 战术指挥核心
block.blackhole-astro-commander.description = 点击它再按电源键：全图所有友方 AI 战斗单位交给概率战术大脑接管（分队、战术采样、集火、包抄、风筝、撤退）。面板可选决策模式，并开关微操、突袭、角色分工与进攻倾向。玩家正在驾驶的单位绝不会被接管；再按一次即归还控制权。

# ---- v8.3 废料循环 / 三级核心 / 守护穹顶 ----
item.blackhole-industrial-waste.name = 工业废料
item.blackhole-industrial-waste.description = 熔渣、碎屑与废滤饼，由淤砂窑、等离子混合器与棱镜压机在正常产出之外附带掉落。进入回收线之前毫无价值。
item.blackhole-metal-swarf.name = 金属碎屑
item.blackhole-metal-swarf.description = 分选出的金属切屑。三份可重熔为一份金矿。
item.blackhole-slag-dust.name = 矿渣粉
item.blackhole-slag-dust.description = 废料中的矿物部分。在淋洗塔中用水冲洗，得到流明浆。
liquid.blackhole-lumen-slurry.name = 流明浆
liquid.blackhole-lumen-slurry.description = 淋洗塔产出的富矿浆液。可结晶为流明矿，并供给循环的两道深加工工序。
block.blackhole-waste-reclaimer.name = 废料分拣厂
block.blackhole-waste-reclaimer.description = 将 4 份工业废料破碎为 1 份金属碎屑与 1 份矿渣粉。回收线的起点，没有它后续工厂全部停摆。
block.blackhole-swarf-furnace.name = 碎屑熔炉
block.blackhole-swarf-furnace.description = 将 3 份金属碎屑熔回 1 份金矿。
block.blackhole-leach-tower.name = 矿渣淋洗塔
block.blackhole-leach-tower.description = 用潮汐水冲洗 3 份矿渣粉，产出流明浆。
block.blackhole-slurry-crystalliser.name = 浆液结晶器
block.blackhole-slurry-crystalliser.description = 由流明浆析出 2 份流明矿。速度慢、耗电高，但永不枯竭。
block.blackhole-resonance-resynthesiser.name = 共振再合成器
block.blackhole-resonance-resynthesiser.description = 以流明矿、金矿与流明浆重新合成 1 份共振碎晶。除四级钻机外唯一的碎晶来源。
block.blackhole-prism-reformer.name = 棱晶再生炉
block.blackhole-prism-reformer.description = 用共振碎晶、棱镜玻璃与流明浆浇铸 2 份棱镜合金。废料循环的终点。
block.blackhole-waste-silo.name = 废料仓
block.blackhole-waste-silo.description = 只存放工业废料，容量 900。工厂成批吐料时缓冲，使回收线连续运转。
block.blackhole-ward-dome.name = 守护穹顶
block.blackhole-ward-dome.description = 范围护盾。吸收弹药直至护盾值耗尽，随后破裂并停机 14 秒，恢复时护盾为空。极光冷却液可扩大穹顶并加快重建；投入共振碎晶可在一段时间内提升护盾上限。
block.blackhole-aurelia-citadel.name = 欧雷利亚堡垒城核心
block.blackhole-aurelia-citadel.description = 三级核心。建造在堡垒核心之上：更大储量、更高单位上限、重装甲，并派出城塞领航者。
unit.blackhole-citadel-pilot.name = 城塞领航者
unit.blackhole-citadel-pilot.description = 堡垒城核心的核心单位。唯一能从矿脉墙体中切割矿石的核心单位；与所有领航者一样，无法开采共振碎晶。
bh.ward.liquid = 穹顶 +{0} 格，重建与回充 x{1}
bh.ward.item = {0}：护盾上限 +{1}，持续 {2} 秒
