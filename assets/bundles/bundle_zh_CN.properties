# v3 炽霄泰坦
unit.blackhole-pyroclast-titan.name = 炽霄泰坦
unit.blackhole-pyroclast-titan.description = 四足熔炉泰坦。55 度仰角熔岩迫击炮、两座火焰扫射器，以及伤得越重燃得越烈的余烬之冠。
status.blackhole-ember-burn.name = 余烬灼烧
status.blackhole-ember-burn.description = 灼热的余烬残留，持续造成伤害。
ability.mendfield = 修复力场
ability.mendfield.description = 以脉冲方式修复处在力场范围内的友方单位。
ability.regrowth = 自我再生
ability.regrowth.description = 未受到攻击时缓慢修复自身装甲。
ability.forcefield = 力场护盾
ability.forcefield.description = 维持一层护盾吸收伤害，停火片刻后自行重建。
ability.prismward = 棱光护盾
ability.prismward.description = 维持一层棱镜护盾吸收伤害，停火片刻后自行重建；护盾满额时还会迟滞正在攻击它的目标。
ability.embercrown = 余烬王冠
ability.embercrown.description = 周期性释放新星，灼烧并点燃周围敌人；生命越低，新星威力越强。

# v3.2 炮台与状态
block.blackhole-loom.name = 循环炮台
block.blackhole-loom.description = 依次发射三种炮弹：穿甲、溅射、电弧。只耗电，不耗弹药。
block.blackhole-well.name = 引力井
block.blackhole-well.description = 投射引力球，定住并拖拽范围内的敌人；坍缩时爆炸，抓到的敌人越多伤害越高。
status.blackhole-grav-tether.name = 引力束缚
status.blackhole-grav-tether.description = 被引力井束缚：移动与装填速度大幅下降。

