unit.blackhole-astro-detainer.name = 拘留者
unit.blackhole-astro-detainer.description = T6：模组中最重的单位，三只机械钳、一面能量护盾，造价远高于任何五级单位。
unit.blackhole-astro-detainer.details = 三只机械钳各自独立选取前方目标。钳子能拦截碰到它的弹体，抛射能量球、发射光枪、刺击和抓取；拦不下的伤害会转为护盾吸收。驾驶时可手动触发各项能力，也可交给AI；AI默认不跃迁，需在指挥菜单中允许。
block.blackhole-astro-fabricator.name = 流明超级工厂
block.blackhole-astro-fabricator.description = 组装拘留者（T6）。
