astro.mode.engage = 正面交战
astro.mode.engage.desc = 所有小队集火正面进攻敌人。
astro.mode.flank = 包抄
astro.mode.flank.desc = 每个小队的一部分绕到敌人侧面（只走开阔地），其余守住正面。
astro.mode.kite = 风筝
astro.mode.kite.desc = 保持最佳射击距离，被近身时后退；坦克守住前排。
astro.mode.advance = 推进
astro.mode.advance.desc = 向敌方核心推进，沿途遇敌即战。
astro.mode.pincer = 钳形
astro.mode.pincer.desc = 各小队从两侧接近敌方核心。
astro.mode.raid = 突袭
astro.mode.raid.desc = 快速小队袭击无人防守的发电机、电池和工厂，其余部队继续施压。
astro.mode.defend = 防守
astro.mode.defend.desc = 在最近的核心周围环形驻守，迎击来敌。
astro.mode.hold = 原地待命
astro.mode.hold.desc = 单位停在原地，射击进入射程的一切目标。
astro.mode.retreat = 撤退
astro.mode.retreat.desc = 全体退回核心。
