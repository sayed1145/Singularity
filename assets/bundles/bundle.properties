# ---- merged v7.5: Voxel Industry + Voxel Outpost
item.blackhole-voxel-alloy.name = Voxel Alloy
item.blackhole-voxel-alloy.description = A lattice of titanium foam grown around a silicon core. Light, stiff and slightly conductive - the structural material of every Voxel Industry frame.
block.blackhole-voxel-forge.name = Voxel Forge
block.blackhole-voxel-forge.description = Three field pylons hold a silicon-titanium melt above the pedestal while eight voxel cells converge into a core, spun inside nested gimbal rings. Finished alloy ingots slide down the chute. Needs cryofluid to keep the pylons cold.
block.blackhole-voxel-assembler.name = Voxel Assembler
block.blackhole-voxel-assembler.description = A gantry printer: the bridge and print head sweep over the bed while a laser builds the actual 3D unit layer by layer. Produces Tessellus, Arachne and Colossus.
unit.blackhole-tessellus.name = Tessellus
unit.blackhole-tessellus.description = Quad-ducted support drone. Its ducts tilt into the direction of flight, the rotors spin up with thrust and the belly twin laser tracks targets on its own. Mines, rebuilds and defends.
unit.blackhole-arachne.name = Arachne
unit.blackhole-arachne.description = Four-legged assault walker. Long legs step over walls while the turret swings a full circle: a heavy main cannon, twin rotary machine guns and a missile pod.
unit.blackhole-titan.name = Colossus
unit.blackhole-titan.description = Two-legged assault mech with a fully independent upper body: the torso, cannons and head turn a full 360 degrees towards the aim while the legs walk, strafe or back-pedal in any direction. Shoulder plasma cannons, arm autocannons and backpack missiles; the thruster pack lets it jump over terrain and slam down on landing.
item.blackhole-magnetic-slug.name = Magnetic Slug
item.blackhole-magnetic-slug.description = An induction-forged projectile for the Bastion railgun. Shipped on ordinary conveyors.
item.blackhole-flux-coil.name = Flux Coil
item.blackhole-flux-coil.description = A wound copper-s silicon accelerator coil. Ammunition for the Aegis lancer.
block.blackhole-slug-press.name = Slug Press
block.blackhole-slug-press.description = Opposed hydraulic pistons compress silicon, graphite and titanium into magnetic slugs. Needs power. Feed its output to a railgun with conveyors.
block.blackhole-coil-winder.name = Coil Winder
block.blackhole-coil-winder.description = Precision winding spindle turns copper and silicon into flux coils. Needs power. Feeds the Aegis lancer.
block.blackhole-bastion-railgun.name = Bastion Railgun
block.blackhole-bastion-railgun.description = Heavy 4x4 siege railgun in an armored bastion ring. Connected corner bastions, rear capacitor bank, rotating turret with recoiling twin rails. Consumes magnetic slugs and power. Targets air and ground.
block.blackhole-aegis-lancer.name = Aegis Lancer
block.blackhole-aegis-lancer.description = Rapid 3x3 coilgun with a compact traversing turret. Fires homing flux bolts in bursts. Consumes flux coils and power. Targets air and ground.

# ---- v7.5 Aurelia industry pack: new drills / generators / unit repair
block.blackhole-aurite-auger.name = Aurite Auger
block.blackhole-aurite-auger.description = Heavy 3x3 auger rig. Four pylons carry the octagonal housing over the seam while the screw column lifts ore to the top collar and out through the south chute. Needs power; mines hardness 4 and below.
block.blackhole-resonance-sifter.name = Resonance Sifter
block.blackhole-resonance-sifter.description = 2x2 vibrating screen. The tilted deck shakes several times a second to separate ore from spoil; feeding it tidewater washes the screen and boosts output.
block.blackhole-prism-harvester.name = Prism Harvester
block.blackhole-prism-harvester.description = Heavy 4x4 pit head. The toothed crown ring drives a five blade cutter underneath and mines hardness 5 and below. Power hungry; lumen plasma speeds it up further.
block.blackhole-rift-collector.name = Rift Collector
block.blackhole-rift-collector.description = A new kind of miner: it ignores the ground beneath it. Place it wherever there is room (water included); it then opens a 34 degree collection cone in the direction it faces and lifts ore straight out of any tile within 16 blocks, through walls, buildings and water, with up to three beams at once. The ore list is the cone itself - it offers whatever the ground in front actually holds, ore in the soil and ore inside rock alike, and the list changes the moment you turn it or the patch runs out. Rotate the block to re-aim it.
block.blackhole-plasma-dynamo.name = Plasma Dynamo
block.blackhole-plasma-dynamo.description = 3x3 horizontal turbine. Resonance shards burn in the plasma loop and spin the impeller on the drum, for a steady 7.2 power/s.
block.blackhole-aurora-array.name = Aurora Array
block.blackhole-aurora-array.description = Large 3x3 photovoltaic array. Three collector wings track the sky along the spine. No fuel, 2.1 power/s.
block.blackhole-lumen-repair-beam.name = Lumen Repair Beam
block.blackhole-lumen-repair-beam.description = Repairs UNITS (use the lumen mender for buildings). The gimbal head turns to the most damaged friendly unit in range and pours in 110 health/s.
block.blackhole-aurora-repair-dome.name = Aurora Repair Dome
block.blackhole-aurora-repair-dome.description = Large unit service station. The emitter crown holds up to four damaged friendly units at once, 240 health/s each, across a 22 block radius.


# ---- v7.6 Aurelia frontier pack
liquid.blackhole-aurora-coolant.name = Aurora Coolant
liquid.blackhole-aurora-coolant.description = Cryogenic working fluid condensed from tidewater. Turret coolant, and a booster for anything that needs heat taken away.
liquid.blackhole-graviton-slurry.name = Graviton Slurry
liquid.blackhole-graviton-slurry.description = A heavy, slow fluid with compressed gravitons suspended in it. Fuel of the gravity tier.
status.blackhole-lattice-grip.name = Lattice Grip
status.blackhole-lattice-grip.description = Held down by a containment lattice: much slower movement and fire rate.
status.blackhole-stasis-lock.name = Stasis Lock
status.blackhole-stasis-lock.description = Sealed in a lattice cage: cannot move, cannot shoot. Immune to being caged again for a while afterwards.
block.blackhole-coolant-condenser.name = Coolant Condenser
block.blackhole-coolant-condenser.description = Compresses and chills tidewater into aurora coolant; the compressor fan on top pulls the heat out.
block.blackhole-graviton-churn.name = Graviton Churn
block.blackhole-graviton-churn.description = A heavy drum that churns lumen plasma and aurite into graviton slurry - the start of the gravity tier.
block.blackhole-flux-conveyor.name = Flux Conveyor
block.blackhole-flux-conveyor.description = The high speed lumen conveyor: 13.2 items/s, about twice the original. Costs prism alloy; use it on main lines.
block.blackhole-flux-conduit.name = Flux Conduit
block.blackhole-flux-conduit.description = High pressure conduit with more capacity and pressure than the lumen conduit; built for long coolant and slurry runs.
block.blackhole-skyline-cableway.name = Skyline Cableway
block.blackhole-skyline-cableway.description = A new transport mechanic: a rope between two towers with item pods gliding over everything in between - walls, water, buildings, enemy lines. Tap another tower to link, up to 26 tiles. No chain of hops like a bridge and no waiting to batch like a mass driver: a pod leaves as soon as it is full.
block.blackhole-gravity-well.name = Gravity Well
block.blackhole-gravity-well.description = A new defensive mechanic: it does not shoot. Three leaning pylons hold a gravity funnel that drags hostile ground units towards the centre and pins them there; anything that reaches the crushing radius is ground down. No effect on air, none on allies. Graviton slurry deepens the well.
block.blackhole-aegis-lattice.name = Aegis Lattice
block.blackhole-aegis-lattice.description = Banks the damage aimed at it: hostile projectiles in range are swallowed, and a full bank is fired back at once as a ring shockwave. Bounded like the absorber wall - it may only take 3000 damage before the field collapses for seven seconds, it sheds 24 intake a second, and every wave locks the field out for five seconds. Useless against an enemy that does not shoot.
block.blackhole-tempest-coil.name = Tempest Coil
block.blackhole-tempest-coil.description = A turret with no barrel. Three insulator stacks carry a floating emitter ring; the bolt it fires jumps on to the next target on every hit, up to four jumps, 22% stronger each time. Cools with aurora coolant.
block.blackhole-resonance-cradle.name = Resonance Cradle
block.blackhole-resonance-cradle.description = A tiny, cheap unit pad available as soon as the drills are researched. Builds motes and lattice crawlers, so the early game no longer has to wait for the Aurelia fabricator.
block.blackhole-lattice-link.name = Lattice Link
block.blackhole-lattice-link.description = A new logic mechanic: every lattice link of the same team shares one 64 cell bank. Write cell 7 on this side of the map and read it on the other - no links, no relay processors.
unit.blackhole-mote.name = Mote
unit.blackhole-mote.description = A palm-sized, cheap drone. A lifting ring around a small pod: it mines, it assists construction, and it defends itself with a lumen needle. Cheap enough to lose in numbers.
unit.blackhole-lattice-crawler.name = Lattice Crawler
unit.blackhole-lattice-crawler.description = A low tracked gun carriage. New attack: the resonance charge it lobs does not burst on impact - it collapses into a ring of shards, to deny ground rather than to trade fire.
unit.blackhole-tide-lancer.name = Tide Lancer
unit.blackhole-tide-lancer.description = A torpedo boat. The forward tubes run torpedoes under the surface: slow, unable to touch aircraft, and far heavier than any gun of the same tier. A light aft gun covers it.

# ---------------------------------------------------------------- v7.7 bastion pack
item.blackhole-graphite-brick.name = Graphite Brick
item.blackhole-graphite-brick.description = Fired silt bound with lumenite. The densest cheap mass on the planet: the wall line is built from it, the string dynamo uses it as a moderator, and the fuel assembly line now takes it instead of loose graphite.
block.blackhole-ore-resonance.name = Resonance Seam
block.blackhole-ore-resonance.description = Resonance shard growing straight out of the soil. Rare, hard, and the only ground ore a tier 4 drill is needed for.
block.blackhole-sinter-wall.name = Sinter Wall
block.blackhole-sinter-wall.description = The cheap wall. Fired brick and lumenite, insulated: arcs and heat stop at it instead of travelling down the line.
block.blackhole-graphite-brick-wall.name = Graphite Brick Wall
block.blackhole-graphite-brick-wall.description = Solid masonry, four tiles. Graphite absorbs beam weapons outright, and the block is insulated as well.
block.blackhole-prism-mirror-wall.name = Prism Mirror Wall
block.blackhole-prism-mirror-wall.description = A faceted mirror on a brick plinth. It deflects a good share of what is shot at it straight back at the shooter.
block.blackhole-stasis-wall.name = Stasis Wall
block.blackhole-stasis-wall.description = Anything touching this wall loses its footing: ground units in contact are held in the containment grip and crawl. A line of these turns a charge into a slow walk.
block.blackhole-echo-wall.name = Echo Wall
block.blackhole-echo-wall.description = Every point of damage it takes is banked. When the bank fills - or the wall finally breaks - the charge leaves as a ring of lightning. Shooting it is how you load it.
block.blackhole-frost-wall.name = Frost Wall
block.blackhole-frost-wall.description = Pipe aurora coolant into it and it repairs itself while it is being shot. Without coolant it is just a heavy aurite wall.
block.blackhole-anchor-wall.name = Anchor Wall
block.blackhole-anchor-wall.description = A deliberately heavy block that drags ground attackers towards itself. It deals no damage; it buys the line behind it the seconds it needs.
block.blackhole-amplifier-wall.name = Amplifier Wall
block.blackhole-amplifier-wall.description = Support masonry: every friendly turret in range reloads faster while this wall stands. Put it behind the firing line, not in front of it.
block.blackhole-absorber-wall.name = Rift Absorber Wall
block.blackhole-absorber-wall.description = Hostile projectiles that cross its field are swallowed whole, and the energy goes into your power grid instead of into the wall.
block.blackhole-concord-shield-wall.name = Concord Shield Wall
block.blackhole-concord-shield-wall.description = Powered wall that holds a shield in front of itself. The shield takes the hits, regenerates, and the block only starts losing health once the shield is overloaded.
block.blackhole-graviton-string-dynamo.name = Graviton String Dynamo
block.blackhole-graviton-string-dynamo.description = A mass held on a graviton string between two counter-rotating gimbals. Graviton slurry keeps the string wound and a graphite brick moderates it; the pair yields thousands of power per second from one 5x5 pad - about eight plasma dynamos.
block.blackhole-aurelia-bastion.name = Aurelia Bastion Core
block.blackhole-aurelia-bastion.description = The tier 2 core. Build it directly on top of an Aurelia Core: twice the storage, twice the unit cap, far more armour, and it launches the Bastion Pilot instead of the Lumen Pilot.
unit.blackhole-bastion-pilot.name = Bastion Pilot
unit.blackhole-bastion-pilot.description = Core unit of the Bastion Core. The fastest miner of the three pilots, builds at nearly twice the range and speed of the Lumen Pilot, and carries a real gun. It cannot mine Resonance.
unit.blackhole-bastion-warden.name = Bastion Warden
unit.blackhole-bastion-warden.description = The escort the tier 2 core unlocks, built in the fabricator. Slow, heavily armoured, one turret with splash shells and a scanning dish that never stops turning.

# v7.8
block.blackhole-aurora-node.name = Large Power Node
block.blackhole-aurora-node.description = Links far more power lines over a much longer distance than the small node.
block.blackhole-resonance-hub.name = Resonance Hub
block.blackhole-resonance-hub.description = Charges while your units fight near it. When the bank fills it overloads every friendly unit in range for six seconds and repairs the buildings around it, then has to recharge.
status.blackhole-resonance-overload.name = Resonance Overload
status.blackhole-resonance-overload.description = More damage, faster movement and faster reload for a short time.
bar.resonance = Resonance: {0} / {1}
unit.blackhole-aurora-heavy.name = Aurora Heavy
unit.blackhole-aurora-heavy.description = Heavy gunship. One turret on top, two fixed side guns, thick armour.
unit.blackhole-prism-scout.name = Prism Scout
unit.blackhole-prism-scout.description = Light tracked scout. Fast, cheap, ground targets only.
unit.blackhole-aurite-lancer.name = Aurite Lancer
unit.blackhole-aurite-lancer.description = Medium tank with one long gun that pierces two targets.
unit.blackhole-resonance-siege.name = Resonance Siege
unit.blackhole-resonance-siege.description = Slow artillery tank. Long range, heavy splash, no air defence.
unit.blackhole-lumen-courier.name = Lumen Courier
unit.blackhole-lumen-courier.description = Support flier. Mines and builds, carries sixty items, does not fight.
unit.blackhole-aurora-sentry.name = Aurora Sentry
unit.blackhole-aurora-sentry.description = Light interceptor with two fixed guns. Hits air and ground.

# ---- v7.9: terrain and the units that come with it
block.blackhole-glass-flat.name = Salt Flat
block.blackhole-glass-flat.description = Hard, bright ground. Units cross it faster than anything else on the planet.
block.blackhole-ember-ash.name = Ember Ash
block.blackhole-ember-ash.description = Warm ash. Counts as hot ground, and holds a little oil.
block.blackhole-frost-crust.name = Frost Crust
block.blackhole-frost-crust.description = Frozen crust. Slow to cross, but damp enough for water extractors.
block.blackhole-aurite-gravel.name = Aurite Gravel
block.blackhole-aurite-gravel.description = Loose stone with metal in it. The ground itself yields aurite.
block.blackhole-resonance-silt.name = Resonance Silt
block.blackhole-resonance-silt.description = Glowing violet dust. Yields silt, and runs slightly warm.
block.blackhole-plasma-vent.name = Plasma Vent
block.blackhole-plasma-vent.description = The hottest ground on Aurelia. Best place for anything that wants heat.
block.blackhole-basalt-shelf.name = Basalt Shelf
block.blackhole-basalt-shelf.description = Plain bedrock. Nothing special, and plenty of oil underneath.
block.blackhole-wall-ore-lumenite.name = Lumenite Seam
block.blackhole-wall-ore-lumenite.description = Lumenite inside solid rock. A rift collector or a borer can take it out of the wall.
block.blackhole-wall-ore-aurite.name = Aurite Seam
block.blackhole-wall-ore-aurite.description = Aurite inside solid rock. A rift collector or a borer can take it out of the wall.
block.blackhole-wall-ore-resonance.name = Resonance Seam
block.blackhole-wall-ore-resonance.description = Resonance shard inside solid rock. Needs a tier four tool to lift.
unit.blackhole-terra-borer.name = Terra Borer
unit.blackhole-terra-borer.description = Mining engineer. Digs ore out of rock walls as well as out of the ground, builds, and carries a hundred and twenty items.
unit.blackhole-basalt-guard.name = Basalt Guard
unit.blackhole-basalt-guard.description = Heavy line tank. Two short cannons, thick armour, no air defence.
unit.blackhole-glass-harrier.name = Glass Harrier
unit.blackhole-glass-harrier.description = Very fast interceptor. Two fixed guns, hits air and ground.
unit.blackhole-vent-caller.name = Vent Caller
unit.blackhole-vent-caller.description = Support gunship. A belly turret lobs shells over walls at ground targets.

# ---- v8.0-beta: logistics and support tier ----
block.blackhole-wall-bore.name = Wall Bore
block.blackhole-wall-bore.description = Fires a straight laser into the rock in front of it and cuts ore seams out of the wall. Six tiles of reach, two lanes. Plasma makes the cut faster.
block.blackhole-lumen-cargo-station.name = Cargo Station
block.blackhole-lumen-cargo-station.description = The logistic network hub. It prints and keeps three porter drones, adopts any hauler without a network, and dispatches every node inside 58 tiles: requests are served from storage first, then from the hub, then from supply posts, and the nearest free drone takes the job.
block.blackhole-lumen-cargo-point.name = Cargo Pad
block.blackhole-lumen-cargo-point.description = Requester node. Set one item and the network keeps it stocked; the pad hands the load to whatever it touches. Belts cannot push into it - only drones fill it.
block.blackhole-lumen-mend-dome.name = Repair Dome
block.blackhole-lumen-mend-dome.description = Large repair projector. Much wider reach and a far stronger pulse than the mender. Prism glass boosts it.
block.blackhole-lumen-accumulator.name = Accumulator
block.blackhole-lumen-accumulator.description = Large power bank. Holds about ten lumen cells in one footprint, and explodes accordingly.
block.blackhole-ground-well.name = Ground Well
block.blackhole-ground-well.description = Pumps tidewater out of damp ground. Output depends on how wet the soil under it is, so a plant no longer has to sit on a lake.
unit.blackhole-lumen-drone.name = Cargo Drone
unit.blackhole-lumen-drone.description = The network's porter. Flies the hauls its hub hands it; built and owned by that hub.
unit.blackhole-lumen-medic.name = Repair Drone
unit.blackhole-lumen-medic.description = Support flier. Heals buildings with a repair beam and can finish construction. Unarmed.
unit.blackhole-aurite-wright.name = Wright
unit.blackhole-aurite-wright.description = Tracked engineer. Fast builder, large cargo hold, mines the floor, and patches damaged buildings.

# ---- v8.1 logistics network, liquid tier and new units
block.blackhole-lumen-supply-post.name = Supply Post
block.blackhole-lumen-supply-post.description = Passive provider. Belts fill it; the network only takes from it when a node actually asked for the item, so it never pushes stock nobody wants.
block.blackhole-lumen-buffer-post.name = Buffer Post
block.blackhole-lumen-buffer-post.description = Requester and provider in one. Set an item and it keeps a local stock of it, then serves the requesters around it - this is what turns one long haul into many short ones.
block.blackhole-lumen-logistics-vault.name = Logistics Vault
block.blackhole-lumen-logistics-vault.description = Network storage. Surplus from the hub is parked here, and a request is served from storage before any supply post is touched, so stock circulates instead of piling up.
block.blackhole-lumen-liquid-relay.name = Liquid Relay
block.blackhole-lumen-liquid-relay.description = Wireless liquid transport. Every relay links itself to the relays within 22 tiles and the linked set levels its contents, so a pylon line crosses ground no conduit can. It levels, it does not pump: nine units a tick, no more.
block.blackhole-lumen-tank.name = Liquid Tank
block.blackhole-lumen-tank.description = Small liquid store, 1500 units. Buffers a pump line or a relay network.
block.blackhole-lumen-reservoir.name = Reservoir
block.blackhole-lumen-reservoir.description = Large liquid store, 6500 units. The tank a plant draws from when its pumps cannot keep up with a burst.
block.blackhole-lumen-overflow-gate.name = Overflow Gate
block.blackhole-lumen-overflow-gate.description = Passes items straight through; anything the block in front will not take is sent to the sides instead.
block.blackhole-lumen-underflow-gate.name = Underflow Gate
block.blackhole-lumen-underflow-gate.description = The inverted gate: items go to the least loaded side first, and only straight on when the sides are full.
unit.blackhole-lumen-hauler.name = Lumen Hauler
unit.blackhole-lumen-hauler.description = Heavy freight flier, 220 items. Built in the fabricator, it finds the nearest hub on its own and joins that network - this is how a network is scaled up.
unit.blackhole-aurite-vanguard.name = Aurite Vanguard
unit.blackhole-aurite-vanguard.description = The ground line-breaker: heavy armour, a piercing main gun with splash, and a coaxial that answers light air. Slow, so it leads a push rather than chasing one.
unit.blackhole-tide-tender.name = Tide Tender
unit.blackhole-tide-tender.description = Naval liquid carrier with a pressure hose. Keeps an island outpost wet before it has the power for a relay chain.

# ---- v8.1: the terrain blocks get a purpose line too, so nothing in the database is blank
block.blackhole-aurora-plate.name = Aurora Plate
block.blackhole-aurora-plate.description = The crystal hardpan most of Aurelia is built on. Flat, dry and buildable; drills reach ore through it.
block.blackhole-prism-shale.name = Prism Shale
block.blackhole-prism-shale.description = Brittle layered rock of the ridges. Buildable ground, and the stone the shale walls around it are cut from.
block.blackhole-lumen-moss.name = Lumen Moss
block.blackhole-lumen-moss.description = Damp luminous ground of the hollows. Buildable, and a sign that water is close under the surface.
block.blackhole-aurora-sand-water.name = Aurora Shallows
block.blackhole-aurora-sand-water.description = Shallow water over silt. Ground units wade through it, naval hulls cannot float here, and pumps work from the bank.
block.blackhole-deep-aurora-water.name = Deep Aurora Water
block.blackhole-deep-aurora-water.description = Open water. Only naval hulls and fliers cross it; it is where the tide dock and the large pumps belong.
block.blackhole-aurora-wall.name = Aurora Massif
block.blackhole-aurora-wall.description = Solid crystal rock. Blocks movement and fire, shelters a base from a lane, and can carry ore seams for the wall bore.
block.blackhole-resonance-wall.name = Resonance Massif
block.blackhole-resonance-wall.description = Rock shot through with resonance crystal. Impassable, and the richest host for wall seams.
block.blackhole-prism-shale-wall.name = Shale Ridge
block.blackhole-prism-shale-wall.description = Layered ridge rock. Impassable cover; the wall bore cuts whatever seams it holds.
block.blackhole-aurora-dune-wall.name = Dune Ridge
block.blackhole-aurora-dune-wall.description = Compacted silt ridge along the beaches. Impassable cover, softer rock than the massifs.
block.blackhole-glass-ridge-wall.name = Glass Ridge
block.blackhole-glass-ridge-wall.description = Glassy rock of the cold flats. Impassable, and a common host for lumenite seams.
block.blackhole-ember-wall.name = Ember Rock
block.blackhole-ember-wall.description = Scorched rock of the hot belts. Impassable cover; aurite seams are often found inside it.
block.blackhole-basalt-wall.name = Basalt Shelf Rock
block.blackhole-basalt-wall.description = Dense dark rock of the highlands. Impassable, the hardest of the Aurelia walls to see past.
block.blackhole-aurora-boulder.name = Aurora Boulder
block.blackhole-aurora-boulder.description = Loose crystal boulder. Decoration only - it is cleared away by anything you build on it.
block.blackhole-resonance-crystal.name = Resonance Crystal
block.blackhole-resonance-crystal.description = A standing crystal growth. Decoration only, but it marks ground where resonance ore is usually near.
block.blackhole-ore-lumenite.name = Lumenite Ore
block.blackhole-ore-lumenite.description = Surface lumenite. The ore every drill starts on and the backbone of the whole economy.
block.blackhole-ore-aurite.name = Aurite Ore
block.blackhole-ore-aurite.description = Surface aurite. The structural metal: walls, armour plate and every mid-tier machine.

# ---- v8.2 command pack ----
bh.vent.stat = {0} shots, then a {1}s vent
aurelia.loadout.desc = Aurelia landing core. Launching to another sector is paid for in Aurelia resources.
block.blackhole-lumen-accelerator.name = Lumen Accelerator
block.blackhole-lumen-accelerator.description = Small overdrive projector. Speeds up every block in a short radius by half again. Cheap, capped, and safe to chain across a factory floor.
block.blackhole-prism-overcharger.name = Prism Overcharger
block.blackhole-prism-overcharger.description = Heavy overdrive projector. Wider field and a higher ceiling; feeding it resonance shards widens the field further. Costly in power, and the boost is hard-capped.
unit.blackhole-prism-monolith.name = Prism Monolith
unit.blackhole-prism-monolith.description = Titan-class siege platform. An armoured slab on three lift pods, carrying one vented prism lance and two light air pods. The lance fires four times, then must vent for six seconds - it breaks a line, it cannot hold one alone.
status.blackhole-astro-warp-license.description = Marks a unit that is allowed to warp. Granted by the detainer's control block; it does nothing on its own.

