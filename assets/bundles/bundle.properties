# v3 Pyroclast Titan
unit.blackhole-pyroclast-titan.name = Pyroclast Titan
unit.blackhole-pyroclast-titan.description = Four-legged furnace Titan. A 55-degree magma mortar, two flame sweepers and an ember crown that flares harder the more it is wounded.
status.blackhole-ember-burn.name = Ember Burn
status.blackhole-ember-burn.description = Searing ember residue that deals damage over time.
ability.mendfield = Repair Field
ability.mendfield.description = Repairs friendly units standing inside its field, in pulses.
ability.regrowth = Regrowth
ability.regrowth.description = Slowly rebuilds its own hull while it is not being hit.
ability.forcefield = Force Field
ability.forcefield.description = Holds a shield that absorbs damage and rebuilds itself after a pause.
ability.prismward = Prism Ward
ability.prismward.description = Holds a prism shield that soaks damage and rebuilds itself after a pause; a full ward also slows whatever is shooting at it.
ability.embercrown = Ember Crown
ability.embercrown.description = Periodically detonates a nova that scorches and ignites nearby enemies; the lower the hull, the stronger the nova.

# v3.2 turrets & status
block.blackhole-loom.name = Cycle Turret
block.blackhole-loom.description = Runs through three shell types in turn: piercing, splash, then lightning. Uses power, no ammo.
block.blackhole-well.name = Gravity Well
block.blackhole-well.description = Lobs an orb that holds enemies in place and drags them inward. It explodes when it collapses, harder the more it caught.
status.blackhole-grav-tether.name = Grav Tether
status.blackhole-grav-tether.description = Caught in a gravity well: heavily slowed movement and reload.

