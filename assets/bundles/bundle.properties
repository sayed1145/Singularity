mod.blackhole.name = Singularity

item.blackhole-degenerate-matter.name = Degenerate Matter
item.blackhole-degenerate-matter.description = Matter compressed until only electron degeneracy pressure holds it up. A spoonful weighs as much as a mountain.

item.blackhole-hawking-dust.name = Hawking Dust
item.blackhole-hawking-dust.description = Condensed high-energy virtual particles evaporated off an event horizon. Holds enormous charge.

item.blackhole-singularity-core.name = Singularity Core
item.blackhole-singularity-core.description = A magnetically bottled micro black hole. Every second it tries to eat the hand that holds it.

block.blackhole-graviton-press.name = Graviton Press
block.blackhole-graviton-press.description = Crushes titanium and graphite into degenerate matter with stacked gravity fields.

block.blackhole-hawking-condenser.name = Hawking Condenser
block.blackhole-hawking-condenser.description = Captures Hawking radiation in a cryogenic chamber, turning degenerate matter and thorium into Hawking dust.

block.blackhole-singularity-forge.name = Containment Prism Forge
block.blackhole-singularity-forge.description = Core production building. A prism containment array pins a live singularity at the centre of the forge: the full gravitational lens from v6.1 bends the scene around it while the accretion disc, jets and photon ring feed the crafting cycle. The 3D prism housing is baked with shadows and ambient occlusion; only the singularity itself is drawn live, within the global frame budget.
block.blackhole-accretion-foundry.name = Accretion Foundry
block.blackhole-accretion-foundry.description = 4x4 casting line: a crucible pours molten titanium-graphite into indexed moulds, a hydraulic press stamps the cooled billets into degenerate-matter plates and a three-axis arm lifts them onto the output rollers. Every moving part is a real 3D piece driven by the craft cycle.

block.blackhole-accretion-cannon.name = Accretion Cannon
block.blackhole-accretion-cannon.description = Dual-barrel rapid turret. Barrels slide on recoil and the charge ring opens during warmup. Fires homing accretion spray, or micro black holes when fed Hawking dust.

block.blackhole-frame-dragger.name = Frame Dragger
block.blackhole-frame-dragger.description = Cheap entry-level rapid turret. Its ring spins continuously; rounds knock back, slow, and pierce up to three targets.

block.blackhole-hawking-emitter.name = Hawking Emitter
block.blackhole-hawking-emitter.description = Collimates horizon evaporation into a piercing beam. Focusing blades fan outward while charging.

block.blackhole-quasar-lance.name = Quasar Lance
block.blackhole-quasar-lance.description = Continuous burn laser. Containment rings counter-rotate and the nozzle deploys in three stages as it spins up; sustained fire ramps damage.

block.blackhole-event-horizon.name = Event Horizon
block.blackhole-event-horizon.description = The ultimate weapon. Three counter-rotating containment rings cradle a real black hole. Its shells plant a genuinely growing black hole that drags and shreds enemies, devours bullets, and truly warps that whole region of the screen.

block.blackhole-horizon-assembler.name = Horizon Assembler
block.blackhole-horizon-assembler.description = Builds air units such as the Lensing and Ergosphere.

block.blackhole-citadel-yard.name = Singularity Yard
block.blackhole-citadel-yard.description = Heavy gantry drydock for ground vehicles and mobile combat platforms. Enormous and power-hungry, but it produces the strongest ground units available.

unit.blackhole-lensing.name = Lensing
unit.blackhole-lensing.description = Light air scout. Fast, with a small hexagonal gravity shield.

unit.blackhole-ergosphere.name = Ergosphere
unit.blackhole-ergosphere.description = Heavy air gunship carrying a micro black hole reactor. Fires paired micro-hole shells behind a large shield, and regenerates.

unit.blackhole-accretor.name = Accretor
unit.blackhole-accretor.description = Tracked ground support vehicle. Dozer blade up front, a repair field that mends nearby allies, and a degenerate shell cannon.

unit.blackhole-citadel.name = Citadel
unit.blackhole-citadel.description = A Titan-class mobile combat platform — a forward base that drives. Its massive tracks roll while moving; the constraint array, pulse core, rear armor and every turret have independent animation. The hangar has been removed, so it produces no aircraft. A main gun plants black holes, with four secondaries splitting air and ground duty.

bullet.blackhole-lensing.name = Gravitational Lens
block.blackhole-needlefall.name = Needlefall
block.blackhole-needlefall.description = Twin-barrel turret. Copper is inexpensive; silicon tracks moving targets.
block.blackhole-sky-net.name = Sky Net
block.blackhole-sky-net.description = Anti-air burst turret. Metaglass shells fragment into anti-air shards.
block.blackhole-prism-lance.name = Prism Lance
block.blackhole-prism-lance.description = Piercing charged beam for ground targets. Requires power.
block.blackhole-crater.name = Crater
block.blackhole-crater.description = Cluster mortar using plastanium or blast compound. Cannot attack targets at point-blank range.
block.blackhole-boreline.name = Boreline
block.blackhole-boreline.description = Two consecutive piercing bolts. Tungsten pierces more targets.
block.blackhole-halo.name = Halo
block.blackhole-halo.description = Guided anti-air missile salvo. Surge alloy creates lightning on impact.

item.blackhole-aegis-alloy.name = Aegis Alloy
item.blackhole-signal-core.name = Signal Core
unit.blackhole-aegis-titan.name = Aegis Titan
unit.blackhole-aegis-titan.description = Six-legged Titan. Charged twin-rail lance and two shoulder missile pods under a hexagonal prism ward. Its steps crush what lies below.

block.blackhole-aegis-press-s.name = Aether Press
block.blackhole-signal-encoder-s.name = Signal Encoder
block.blackhole-titan-bay-s.name = Titan Bay

