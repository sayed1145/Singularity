# ---- v8.3 Astro restoration ----
block.blackhole-astro-commander.name = Tactical Command Core
block.blackhole-astro-commander.description = Tap it and press the power button: every allied AI combat unit on the map is taken over by a probabilistic tactical brain (squads, tactic sampling, focus fire, flanking, kiting, retreat). The panel picks a decision mode and sets micro, raids, roles and aggression. Units a player is flying are never touched; press the button again to hand control back.

# ---- v8.3 waste cycle / tier-3 core / ward dome ----
item.blackhole-industrial-waste.name = Industrial Waste
item.blackhole-industrial-waste.description = Slag, swarf and spent filter cake, dropped by the kiln, the mixer and the prism press on top of their normal output. Worthless until the reclaimer line gets hold of it.
item.blackhole-metal-swarf.name = Metal Swarf
item.blackhole-metal-swarf.description = Sorted metal cuttings. Three of them melt back into one Aurite.
item.blackhole-slag-dust.name = Slag Dust
item.blackhole-slag-dust.description = The mineral half of the waste. Washed with water in the leach tower to make Lumen Slurry.
liquid.blackhole-lumen-slurry.name = Lumen Slurry
liquid.blackhole-lumen-slurry.description = Mineral-rich wash from the leach tower. Crystallises into Lumenite and feeds both deep steps of the cycle.
block.blackhole-waste-reclaimer.name = Waste Reclaimer
block.blackhole-waste-reclaimer.description = Shreds 4 Industrial Waste into 1 Metal Swarf and 1 Slag Dust. The head of the recycling line: nothing downstream runs without it.
block.blackhole-swarf-furnace.name = Swarf Furnace
block.blackhole-swarf-furnace.description = Melts 3 Metal Swarf into 1 Aurite.
block.blackhole-leach-tower.name = Leach Tower
block.blackhole-leach-tower.description = Washes 3 Slag Dust with Tidewater and pours out Lumen Slurry.
block.blackhole-slurry-crystalliser.name = Slurry Crystalliser
block.blackhole-slurry-crystalliser.description = Grows 2 Lumenite out of Lumen Slurry. Slow, power hungry, and it never runs dry.
block.blackhole-resonance-resynthesiser.name = Resonance Resynthesiser
block.blackhole-resonance-resynthesiser.description = Re-grows 1 Resonance Shard from Lumenite, Aurite and Lumen Slurry. The only shard source that is not a tier 4 drill.
block.blackhole-prism-reformer.name = Prism Reformer
block.blackhole-prism-reformer.description = Casts 2 Prism Alloy from Resonance Shards, Prism Glass and Lumen Slurry. The top of the waste cycle.
block.blackhole-waste-silo.name = Waste Silo
block.blackhole-waste-silo.description = Holds 900 Industrial Waste and nothing else, so the reclaimer line keeps running between factory bursts.
block.blackhole-ward-dome.name = Ward Dome
block.blackhole-ward-dome.description = Area shield. Swallows shots until its bank runs out, then breaks and stays down for 14 s before coming back empty. Aurora Coolant widens the dome and speeds the rebuild; a Resonance Shard deepens the bank for a while.
block.blackhole-aurelia-citadel.name = Aurelia Citadel Core
block.blackhole-aurelia-citadel.description = The tier 3 core. Build it over a Bastion Core: more storage, a higher unit cap, heavy armour, and it launches the Citadel Pilot.
unit.blackhole-citadel-pilot.name = Citadel Pilot
unit.blackhole-citadel-pilot.description = Core unit of the Citadel Core. The only core unit that can cut ore out of wall seams; like every pilot, it cannot mine Resonance.
bh.ward.liquid = dome +{0} blocks, rebuild and regen x{1}
bh.ward.item = {0}: shield bank +{1} for {2} s
