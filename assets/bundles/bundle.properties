# v5 unified Singularity + Aegis Titan Matrix expansion

# Updated fusion descriptions
item.blackhole-aegis-alloy.description = Dual-planet composite armor alloy. Its press recipe now needs Singularity degenerate matter.
item.blackhole-signal-core.description = Encoded control core for Titan logic and production. Its encoder now stabilizes the signal with Hawking dust.
block.blackhole-aegis-press-s.description = Presses titanium, plastanium, phase fabric and degenerate matter into Aegis Alloy.
block.blackhole-signal-encoder-s.description = Encodes Aegis Alloy, silicon, surge alloy and Hawking dust into a Signal Core.
block.blackhole-titan-bay-s.description = Builds two Titans: Aegis and Pyroclast. Their plans also require Singularity Cores. Keep its forward output clear.

# v6 Aurelia expedition
planet.blackhole-aurelia.name = Aurelia
item.blackhole-lumenite.name = Lumenite
item.blackhole-lumenite.description = Blue-white crystalline ore mined from Aurelia's plate fields.
item.blackhole-resonance-shard.name = Resonance Shard
item.blackhole-resonance-shard.description = A stabilized fragment emitted by a defended Rift Anchor. It cannot be manufactured in an ordinary factory.
item.blackhole-prism-alloy.name = Prism Alloy
item.blackhole-prism-alloy.description = Reflective structural alloy pressed from Lumenite and Resonance Shards.
item.blackhole-concord-core.name = Concord Core
item.blackhole-concord-core.description = A rare coordination core emitted when three stabilized Rift Anchors harmonize around one Relay.
block.blackhole-aurelia-core.name = Aurelia Core
block.blackhole-aurelia-core.description = Expedition command core for the Aurelia campaign. Supports up to 18 units.
block.blackhole-rift-anchor.name = Rift Anchor
block.blackhole-rift-anchor.description = Place only on a natural Resonance Bed. With power and no enemies nearby, it stabilizes the rift and periodically emits Resonance Shards. Losing the area drains its progress rather than destroying it.
block.blackhole-harmonic-relay.name = Harmonic Relay
block.blackhole-harmonic-relay.description = A spatial network device, not a factory. Place it within range of three defended, stabilized Rift Anchors to synthesize Concord Cores.
block.blackhole-prism-press.name = Prism Press
block.blackhole-prism-press.description = Presses Lumenite and Resonance Shards into Prism Alloy.
block.blackhole-aurelia-fabricator.name = Aurelia Fabricator
block.blackhole-prism-pylon.name = Prism Pylon
block.blackhole-prism-pylon.description = Long-range piercing power turret.
block.blackhole-arc-mortar.name = Arc Mortar
block.blackhole-arc-mortar.description = Power artillery that lobs resonance charges at ground targets.
unit.blackhole-glint.name = Glint
unit.blackhole-glint.description = Fast Aurelia reconnaissance drone.
unit.blackhole-aurora-guard.name = Aurora Guard
unit.blackhole-aurora-guard.description = Shielded expedition guard with paired prism lances and a hexagonal prism ward.
bar.blackhole.rift-stability = Rift stability
bar.blackhole.rift-threatened = Rift threatened
bar.blackhole.harmonic-links = Stabilized anchors: {0}/{1}
# v6.1 Aurelia recovery: self-starting campaign and cross-planet allocation
planet.blackhole-aurelia.description = A pale expedition world with its own materials, machines and units. Every landing begins at an Aurelia Core stocked with Lumenite and Aurite, next to Lumenite and Aurite ore, a silt dune, a tidewater pond and four defendable Resonance Beds.
unit.blackhole-lumen-pilot.name = Lumen Chassis
unit.blackhole-lumen-pilot.description = Aurelia's player-controlled launch frame. Mines Lumenite, builds structures and carries a small prism emitter.
block.blackhole-lumen-extractor.name = Lumen Extractor
block.blackhole-lumen-extractor.description = Aurelia's drill. Mines Lumenite, Aurite and Silt.
block.blackhole-aurora-panel.name = Aurora Panel
block.blackhole-aurora-panel.description = Starter solar generator. Its quiet cyan array powers early Rift Anchors.
block.blackhole-prism-resonator.name = Prism Resonator
block.blackhole-prism-resonator.description = Uses Lumen Plasma to refine twice the Prism Alloy from Lumenite and Resonance Shards.
block.blackhole-aurelia-fabricator.description = Builds the Aurelia ground and air units.

# v7
setting.bh-lens.name = Black hole gravitational lensing (GPU)

# v7.1: Aurelia uses only its own content
item.blackhole-aurite.name = Aurite
item.blackhole-aurite.description = Soft golden metal mined from Aurelia ore veins. Structure, walls, ammunition and naval hulls.
item.blackhole-silt.name = Silt
item.blackhole-silt.description = Fine violet-grey silt dredged from aurora sand. Fired with Lumenite into Prism Glass.
item.blackhole-prism-glass.name = Prism Glass
item.blackhole-prism-glass.description = Clear hexagonal glass fired from Silt and Lumenite. Optics, logic and menders.
liquid.blackhole-tidewater.name = Tidewater
liquid.blackhole-tidewater.description = Mineral-rich water pumped from Aurelia's shallows. Drives tide turbines and feeds the plasma mixer.
liquid.blackhole-lumen-plasma.name = Lumen Plasma
liquid.blackhole-lumen-plasma.description = Violet plasma mixed from Tidewater and Lumenite. Required by the Prism Resonator.
status.blackhole-brine-soaked.name = Brine-soaked
status.blackhole-brine-soaked.description = Slowed by mineral water. Resonance shocks hit soaked targets harder; extinguishes Lumen Burn.
status.blackhole-lumen-burn.name = Lumen Burn
status.blackhole-lumen-burn.description = Cold blue fire that slowly eats through armour.
status.blackhole-resonance-shock.name = Resonance Shock
status.blackhole-resonance-shock.description = Harmonic shock: slower movement and slower weapons.
block.blackhole-resonance-bed.name = Resonance Bed
block.blackhole-resonance-bed.description = Natural resonance node. Rift Anchors can only be built here.
block.blackhole-aurora-sand.name = Aurora Sand
block.blackhole-aurora-sand.description = Loose sand; drills extract Silt from it.
block.blackhole-aurora-water.name = Aurora Shallows
block.blackhole-aurora-water.description = Pumps draw Tidewater from it. Soaks units wading through.
block.blackhole-lumen-vault.name = Lumen Vault
block.blackhole-lumen-vault.description = Stores items. Adjacent to a core it extends the core's storage.
block.blackhole-lumen-unloader.name = Lumen Unloader
block.blackhole-lumen-unloader.description = Pulls the selected item out of adjacent containers.
block.blackhole-lumen-mender.name = Lumen Mender
block.blackhole-lumen-mender.description = Periodically repairs nearby blocks with a pulse of lumen light.
block.blackhole-lumen-conveyor.name = Lumen Conveyor
block.blackhole-lumen-conveyor.description = Moves items forward along a lit belt.
block.blackhole-lumen-junction.name = Lumen Junction
block.blackhole-lumen-junction.description = Lets two conveyor lines cross.
block.blackhole-lumen-router.name = Lumen Router
block.blackhole-lumen-router.description = Splits items into up to three directions.
block.blackhole-lumen-sorter.name = Lumen Sorter
block.blackhole-lumen-sorter.description = Passes the selected item straight on; others go left and right.
block.blackhole-lumen-bridge.name = Lumen Bridge
block.blackhole-lumen-bridge.description = Carries items over terrain and buildings.
block.blackhole-tide-pump.name = Tide Pump
block.blackhole-tide-pump.description = Pumps Tidewater from Aurelia shallows.
block.blackhole-lumen-conduit.name = Lumen Conduit
block.blackhole-lumen-conduit.description = Moves liquids forward.
block.blackhole-lumen-liquid-router.name = Lumen Liquid Router
block.blackhole-lumen-liquid-router.description = Distributes liquids to all sides.
block.blackhole-lumen-liquid-bridge.name = Lumen Liquid Bridge
block.blackhole-lumen-liquid-bridge.description = Carries liquids over terrain and buildings.
block.blackhole-lumen-burner.name = Lumen Burner
block.blackhole-lumen-burner.description = Burns Lumenite for power.
block.blackhole-tide-turbine.name = Tide Turbine
block.blackhole-tide-turbine.description = Generates power from flowing Tidewater.
block.blackhole-lumen-node.name = Lumen Node
block.blackhole-lumen-node.description = Links power between buildings.
block.blackhole-lumen-cell.name = Lumen Cell
block.blackhole-lumen-cell.description = Stores surplus power.
block.blackhole-silt-kiln.name = Silt Kiln
block.blackhole-silt-kiln.description = Fires Silt and Lumenite into Prism Glass.
block.blackhole-plasma-mixer.name = Plasma Mixer
block.blackhole-plasma-mixer.description = Mixes Tidewater and Lumenite into Lumen Plasma.
block.blackhole-lumenite-wall.name = Lumenite Wall
block.blackhole-lumenite-wall.description = Basic Aurelia wall.
block.blackhole-lumenite-wall-large.name = Large Lumenite Wall
block.blackhole-lumenite-wall-large.description = Basic Aurelia wall, four tiles.
block.blackhole-aurite-wall.name = Aurite Wall
block.blackhole-aurite-wall.description = Heavy golden wall.
block.blackhole-aurite-wall-large.name = Large Aurite Wall
block.blackhole-aurite-wall-large.description = Heavy golden wall, four tiles.
block.blackhole-lumen-spark.name = Lumen Spark
block.blackhole-lumen-spark.description = Starter power turret: fast lumen bolts that jolt targets with Resonance Shock.
block.blackhole-shard-volley.name = Shard Volley
block.blackhole-shard-volley.description = Twin-barrel item turret firing Aurite slugs or Resonance Shard bolts. Tidewater cooling speeds it up.
block.blackhole-tide-dock.name = Tide Dock
block.blackhole-tide-dock.description = Floating shipyard. Builds Aurelia naval units: Tide Skiff and Tide Warden.
block.blackhole-lumen-processor.name = Lumen Processor
block.blackhole-lumen-processor.description = Runs logic code (same instruction set as the micro processor).
block.blackhole-lumen-memory.name = Lumen Memory
block.blackhole-lumen-memory.description = Stores numbers for logic processors.
block.blackhole-lumen-switch.name = Lumen Switch
block.blackhole-lumen-switch.description = A toggle readable by logic processors.
block.blackhole-lumen-message.name = Lumen Message
block.blackhole-lumen-message.description = Stores a text message. Writable by logic processors.
block.blackhole-lumen-display.name = Lumen Display
block.blackhole-lumen-display.description = Displays graphics drawn by logic processors.
unit.blackhole-shard-rover.name = Shard Rover
unit.blackhole-shard-rover.description = Light tracked tank with a single resonance cannon.
unit.blackhole-aurite-bulwark.name = Aurite Bulwark
unit.blackhole-aurite-bulwark.description = Heavy line tank. Twin-barrel turret, thick golden armour.
unit.blackhole-tide-skiff.name = Tide Skiff
unit.blackhole-tide-skiff.description = Fast naval patrol boat.
unit.blackhole-tide-warden.name = Tide Warden
unit.blackhole-tide-warden.description = Naval escort with two twin turrets fore and aft.
status.blackhole-titan-overclock.name = Titan Overclock
status.blackhole-titan-overclock.description = Titan weapons over-driven by the command link: +22% damage, +18% fire rate, +8% speed.


# ---- merged v7.4: Astro Detainer + RBMK White Reactor ----
unit.blackhole-astro-detainer.name = Detainer
unit.blackhole-astro-detainer.description = T6. The heaviest unit in the pack: three claws, an energy shield, and a cost well past any tier 5 unit.
unit.blackhole-astro-detainer.details = Three identical claws, each picking its own target in front of it. A claw catches shots that touch it, throws energy orbs, fires a lance, stabs and grabs. Damage it cannot catch raises a shield instead. Piloted, a panel lets you fire the abilities yourself or leave them to the AI; the long-range warp is off for the AI until you allow it in the command menu.
block.blackhole-astro-fabricator.name = Lumen Superfactory
block.blackhole-astro-fabricator.description = Assembles the Detainer (T6).
