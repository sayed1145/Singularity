item.blackhole-uranium-pellets.name = Enriched Fuel Pellets
item.blackhole-uranium-pellets.description = Ceramic fuel pellets from a gameplay fuel process. The recipe is for Mindustry balance, not real nuclear-fuel manufacturing.
item.blackhole-zirconium-cladding.name = Zirconium Cladding
item.blackhole-zirconium-cladding.description = Heat-resistant, low-absorption cladding used to seal fuel pellets.
item.blackhole-uranium-assembly.name = Uranium Fuel Assembly
item.blackhole-uranium-assembly.description = Reactor fuel assembled from pellets, cladding and graphite structural parts.
liquid.blackhole-demineralized-water.name = Demineralized Light Water
liquid.blackhole-demineralized-water.description = Polished primary-loop feedwater used for channel cooling, boiling and steam production.
block.blackhole-pellet-plant.name = Nuclear Fuel Pellet Plant
block.blackhole-pellet-plant.description = Processes vanilla thorium and silicon into mod fuel pellets. This is a gameplay recipe that keeps the chain obtainable on vanilla maps.
block.blackhole-cladding-mill.name = Cladding Rolling Mill
block.blackhole-cladding-mill.description = Produces zirconium-style fuel cladding from titanium and metaglass.
block.blackhole-fuel-assembly-plant.name = Fuel Assembly Plant
block.blackhole-fuel-assembly-plant.description = Combines pellets, cladding and graphite into uranium fuel assemblies consumed by the reactor.
block.blackhole-water-treatment.name = Demineralized Water Plant
block.blackhole-water-treatment.description = Uses vanilla water and power to continuously output reactor-grade demineralized water.
block.blackhole-graphite-kiln.name = Graphite Calcining Kiln
block.blackhole-graphite-kiln.description = Rotary kiln. Since v7.7 it calcines silt with a lumenite flux into graphite bricks - the material the whole bastion wall line, the graviton string dynamo and the fuel assembly plant are built on. No water needed; only steam leaves the stack.
block.blackhole-rbmk-plant.name = White RBMK Power Station Mk.II
block.blackhole-rbmk-plant.description = High-output white software-3D station with a complete supply chain, guided mode and expert operation. Nominal output is five times v1; a stable expert configuration reaches ten times v1.
